<title>Thammachart Harbour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">

<style>
  :root {
    /* Deep sea → ice */
    --sea-900: #07333d;
    --sea-800: #0b4552;
    --tide: #0f7383;
    --tide-600: #0c5f6d;
    --tide-wash: #e2eff0;
    --coral: #e0664a;
    --coral-deep: #c14a30;

    --bg: #eef3f2;
    --surface: #ffffff;
    --surface-2: #f5f8f7;
    --ink: #10262c;
    --ink-2: #3c5158;
    --ink-muted: #63797f;
    --line: #d9e3e2;
    --line-soft: #e8efee;

    --bar-ink: #d3e4e4;
    --bar-ink-dim: rgba(211, 228, 228, 0.6);

    /* Status */
    --st-todo: #6b7b82;
    --st-doing: #2f7fa8;
    --st-wait: #b8791b;
    --st-block: #c2412f;
    --st-done: #177a5e;
    --st-ink: #ffffff;

    /* Streams — categorical, separated for CVD */
    --s-ops: #0f7383;
    --s-retail: #7b57c9;
    --s-food: #b04a8a;
    --s-source: #2f6fb5;
    --s-quality: #2f7d4a;
    --s-intake: #c2681f;

    --danger: #c2412f;
    --warning: #a86e10;
    --success: #177a5e;

    --radius: 10px;
    --shadow: 0 1px 2px rgb(7 51 61 / 0.05), 0 10px 26px -18px rgb(7 51 61 / 0.4);
    --row-cols: minmax(280px, 1fr) 124px 140px 144px 104px 120px 70px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sea-900: #05202a;
      --sea-800: #0a3340;
      --tide: #38a6b8;
      --tide-600: #2b8b9b;
      --tide-wash: rgba(56, 166, 184, 0.14);
      --coral: #f0836a;
      --coral-deep: #e0664a;

      --bg: #06222a;
      --surface: #0d323c;
      --surface-2: #113c48;
      --ink: #e6f0ef;
      --ink-2: #b3c8cb;
      --ink-muted: #8ba3a8;
      --line: rgba(178, 216, 218, 0.16);
      --line-soft: rgba(178, 216, 218, 0.09);

      --bar-ink: #cfe3e3;
      --bar-ink-dim: rgba(207, 227, 227, 0.58);

      --st-todo: #7e8f96;
      --st-doing: #4796bd;
      --st-wait: #cf9226;
      --st-block: #db6150;
      --st-done: #2e9a78;
      --st-ink: #04191f;

      --s-ops: #3ea7b7;
      --s-retail: #a68ae0;
      --s-food: #dd7ab6;
      --s-source: #5f9ce0;
      --s-quality: #4faa73;
      --s-intake: #e0904a;

      --danger: #e2705e;
      --warning: #d3a03a;
      --success: #3ea583;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 30px -20px rgb(0 0 0 / 0.8);
    }
  }

  :root[data-theme="dark"] {
    --sea-900: #05202a;
    --sea-800: #0a3340;
    --tide: #38a6b8;
    --tide-600: #2b8b9b;
    --tide-wash: rgba(56, 166, 184, 0.14);
    --coral: #f0836a;
    --coral-deep: #e0664a;

    --bg: #06222a;
    --surface: #0d323c;
    --surface-2: #113c48;
    --ink: #e6f0ef;
    --ink-2: #b3c8cb;
    --ink-muted: #8ba3a8;
    --line: rgba(178, 216, 218, 0.16);
    --line-soft: rgba(178, 216, 218, 0.09);

    --bar-ink: #cfe3e3;
    --bar-ink-dim: rgba(207, 227, 227, 0.58);

    --st-todo: #7e8f96;
    --st-doing: #4796bd;
    --st-wait: #cf9226;
    --st-block: #db6150;
    --st-done: #2e9a78;
    --st-ink: #04191f;

    --s-ops: #3ea7b7;
    --s-retail: #a68ae0;
    --s-food: #dd7ab6;
    --s-source: #5f9ce0;
    --s-quality: #4faa73;
    --s-intake: #e0904a;

    --danger: #e2705e;
    --warning: #d3a03a;
    --success: #3ea583;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 30px -20px rgb(0 0 0 / 0.8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", "IBM Plex Sans Thai", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }

  :where(a, button, input, select, [tabindex]):focus-visible {
    outline: 2px solid var(--coral);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .tnum { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 16px;
    height: 54px; padding: 0 18px;
    background: var(--sea-900);
    color: var(--bar-ink);
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg, var(--tide), var(--coral) 65%, var(--sea-800)) 1;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand .mark {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: #fff;
  }
  .brand .mark em { color: var(--coral); font-style: normal; }
  .brand .org { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bar-ink-dim); white-space: nowrap; }
  .topbar .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.1);
    border-radius: 99px; padding: 4px 11px; font-size: 12px; color: var(--bar-ink); cursor: pointer;
  }
  .topbar .chip:hover { background: rgb(255 255 255 / 0.14); }
  .topbar .spacer { flex: 1; }
  .topbar .iconbtn {
    border: 0; background: rgb(255 255 255 / 0.07); color: var(--bar-ink);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .topbar .iconbtn:hover { background: rgb(255 255 255 / 0.15); }
  .topbar .me { display: flex; align-items: center; gap: 9px; }
  .topbar .me span.n { font-size: 12.5px; color: var(--bar-ink); }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }

  .rail {
    position: sticky; top: 54px;
    height: calc(100dvh - 54px);
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .rail .sect { padding: 14px 10px 6px; }
  .rail a {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; border-radius: 8px;
    font-size: 13.5px; color: var(--ink-2); text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .rail a:hover { background: var(--surface-2); color: var(--ink); }
  .rail a[aria-current="page"] { background: var(--tide-wash); color: var(--tide-600); font-weight: 600; }
  .rail a .ico { width: 17px; height: 17px; flex: none; opacity: 0.75; }
  .rail a[aria-current="page"] .ico { opacity: 1; color: var(--tide); }
  .rail a .badge {
    margin-left: auto; font-size: 11px; font-weight: 600;
    background: var(--coral); color: #fff; border-radius: 99px; padding: 0 6px;
  }
  .rail .streams { display: flex; flex-direction: column; gap: 1px; }
  .rail .streams button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 0; background: none; cursor: pointer; text-align: left;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2);
  }
  .rail .streams button:hover { background: var(--surface-2); color: var(--ink); }
  .rail .streams i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .rail .streams .c { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }

  main { min-width: 0; padding: 26px 30px 60px; }

  /* ---------- Page head ---------- */
  .pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; justify-content: space-between; }
  .pagehead h1 {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 34px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05;
    text-wrap: balance;
  }
  .pagehead .sub { margin-top: 5px; color: var(--ink-muted); font-size: 13px; }
  .headtools { display: flex; align-items: center; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-muted); }
  .btn-primary { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--coral-deep); border-color: var(--coral-deep); }

  /* ---------- KPI strip ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--kpi-color, var(--line)); }
  .kpi .v { font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .kpi .k { margin-top: 1px; }
  .kpi .hint { margin-top: 5px; font-size: 11.5px; color: var(--ink-muted); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin-top: 24px; padding-bottom: 11px; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 3px; }
  .tab {
    border: 0; background: none; padding: 7px 12px 10px; cursor: pointer;
    color: var(--ink-muted); font-size: 13.5px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -12px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--coral); }
  .tab .n { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--ink-muted); font-weight: 600; border: 1px solid var(--line-soft); }
  .tab[aria-selected="true"] .n { background: var(--tide-wash); color: var(--tide-600); border-color: transparent; }

  .spacer { flex: 1; }

  .search { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .search input { border: 0; background: none; outline: none; color: inherit; font-size: 13px; width: 168px; }
  .search input::placeholder { color: var(--ink-muted); }

  .facepile { display: flex; align-items: center; gap: 5px; }
  .facepile .avatar-btn {
    border: 0; padding: 0; background: none; cursor: pointer; border-radius: 99px; line-height: 0;
    opacity: 0.4; transition: opacity 0.15s ease;
  }
  .facepile .avatar-btn:hover { opacity: 0.8; }
  .facepile .avatar-btn.on { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--coral); }

  .toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--tide); width: 15px; height: 15px; }

  /* ---------- Avatars ---------- */
  .avatar {
    width: 26px; height: 26px; border-radius: 99px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: #fff; flex: none;
  }
  .avatar.lg { width: 34px; height: 34px; font-size: 12px; }
  .avatar.lead { box-shadow: inset 0 0 0 1.5px var(--coral); }

  /* ---------- Board ---------- */
  .scroller { overflow-x: auto; margin-top: 18px; padding-bottom: 4px; }
  .board { min-width: 1090px; display: flex; flex-direction: column; gap: 18px; }

  .group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 15px; }
  .group-head .caret { border: 0; background: none; cursor: pointer; color: var(--ink-muted); padding: 2px; line-height: 0; transition: transform 0.18s ease; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .tag { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); flex: none; }
  .group-head h3 { font-size: 14.5px; font-weight: 600; color: var(--gc); }
  .group-head .count { font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini .dotstat { display: inline-flex; align-items: center; gap: 5px; }
  .group-head .mini i { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }

  .cols, .row { display: grid; grid-template-columns: var(--row-cols); align-items: center; column-gap: 12px; }
  .cols { padding: 7px 15px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }
  .group.collapsed .cols, .group.collapsed .rows { display: none; }

  .row { padding: 9px 15px; border-top: 1px solid var(--line-soft); transition: background-color 0.12s ease; }
  .row:hover { background: var(--surface-2); }
  .row.is-done .task-title { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .task { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .check {
    width: 17px; height: 17px; margin-top: 2px; flex: none;
    border-radius: 5px; border: 1.5px solid var(--line); background: var(--surface);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .check:hover { border-color: var(--st-done); }
  .check.on { background: var(--st-done); border-color: var(--st-done); color: #fff; }
  .task-title {
    font-size: 13.5px; line-height: 1.35; text-align: left; display: block;
    border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit; color: inherit;
  }
  .task-title:hover { text-decoration: underline; text-underline-offset: 2px; }
  .task-meta { margin-top: 3px; min-height: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-muted); }
  .chip-repeat { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px 0 5px; height: 17px; color: var(--ink-2); }
  .task-note { color: var(--danger); }

  .owner-cell { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 3px 5px; border-radius: 8px; cursor: pointer; min-width: 0; text-align: left; }
  .owner-cell:hover { background: var(--line-soft); }
  .owner-cell .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status {
    border: 0; cursor: pointer; width: 100%; height: 29px; border-radius: 6px;
    color: var(--st-ink); background: var(--sc);
    font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    transition: filter 0.15s ease;
  }
  .status:hover { filter: brightness(1.08); }

  .buchip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    border: 1px solid var(--line); background: var(--surface); border-radius: 99px;
    padding: 3px 10px 3px 8px; font-size: 12px; color: var(--ink-2); cursor: pointer;
    justify-self: start;
  }
  .buchip i { width: 8px; height: 8px; border-radius: 2px; background: var(--bc); flex: none; }
  .buchip:hover { border-color: var(--bc, var(--ink-muted)); color: var(--ink); background: var(--surface-2); }
  .buchip.empty { border-style: dashed; color: var(--ink-muted); opacity: 0; }
  .row:hover .buchip.empty, .buchip.empty:focus-visible { opacity: 1; }
  @media (hover: none) { .buchip.empty { opacity: 1; } }
  .selfilter {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .status.ro, .buchip.ro, .owner-cell.ro { cursor: default; }
  .status.ro:hover { filter: none; }
  .buchip.ro:hover { border-color: var(--line); color: var(--ink-2); background: var(--surface); }
  .owner-cell.ro:hover { background: none; }
  .check[disabled] { cursor: default; opacity: 0.6; }
  .prio { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .prio i { width: 3px; height: 13px; border-radius: 2px; background: var(--pc); display: inline-block; }
  .prio.p-critical { color: var(--danger); font-weight: 600; }
  .prio.p-high { font-weight: 600; }
  .prio.p-low { color: var(--ink-muted); }

  .due { font-size: 12.5px; }
  .due small { display: block; font-size: 10.5px; color: var(--ink-muted); }
  .due.overdue { color: var(--danger); font-weight: 600; }
  .due.overdue small { color: var(--danger); opacity: 0.85; }
  .due.today { color: var(--tide-600); font-weight: 600; }

  .est { font-size: 12.5px; color: var(--ink-muted); text-align: right; }

  .addrow {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 15px 11px 34px; border-top: 1px solid var(--line-soft);
    color: var(--ink-muted); font-size: 12.5px;
    border-width: 0; background: none; cursor: pointer; width: 100%;
  }
  .addrow:hover { color: var(--ink); background: var(--surface-2); }
  .group.collapsed .addrow { display: none; }

  .empty { padding: 40px 16px; text-align: center; color: var(--ink-muted); font-size: 13px; }

  /* ---------- Task drawer, rich text, comments ---------- */
  .scrim { position: fixed; inset: 0; background: rgb(7 51 61 / 0.42); z-index: 70; }
  /* an author display value would otherwise beat the hidden attribute */
  .scrim[hidden], .drawer[hidden] { display: none !important; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100dvh; width: min(560px, 100vw); z-index: 71;
    background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: -20px 0 52px -26px rgb(7 51 61 / 0.55);
    display: flex; flex-direction: column;
  }
  .dhead { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line-soft); }
  .streamtag { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--sc); }
  .streamtag i { width: 9px; height: 9px; border-radius: 3px; background: var(--sc); }
  .dhead .iconbtn-sm { font-size: 17px; }
  .dbody { overflow-y: auto; padding: 16px 18px 44px; display: flex; flex-direction: column; gap: 18px; }
  .dtitle {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 22px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em;
    outline: none; border-radius: 8px; padding: 3px 5px; margin: -3px -5px;
  }
  .dtitle:focus { background: var(--bg); box-shadow: 0 0 0 2px var(--tide); }
  .colorrow { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
  .colorrow .lbl { font-size: 11px; color: var(--ink-muted); margin-right: 2px; }
  .swatchbtn { width: 19px; height: 19px; border-radius: 99px; border: 2px solid transparent; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12); }
  .swatchbtn.on { border-color: var(--ink); }
  .swatchbtn.none { background: var(--surface); position: relative; }
  .swatchbtn.none::after { content: ""; position: absolute; inset: 3px; border-top: 1.5px solid var(--danger); transform: rotate(45deg); }

  .dmeta { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 9px 12px; align-items: center; font-size: 13px; }
  .dmeta .k { color: var(--ink-muted); font-size: 12px; }
  .dmeta .status { width: 148px; }
  .dmeta input[type="date"], .dmeta input[type="number"] {
    border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 8px;
    font: inherit; font-size: 13px; color: inherit; width: 168px;
  }

    var html = NAV.filter(function (n) { return !n.perm || can(n.perm); }).map(function (n) {
      var svg = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n.icon] + "</svg>";
      var badge = n.badge ? n.badge() : 0;
      return '<a href="#" data-page="' + n.page + '"' + (state.page === n.page ? ' aria-current="page"' : "") + ">" +
        svg + T(n.label) + (badge ? '<span class="badge tnum">' + badge + "</span>" : "") + "</a>";
    }).join("");

    if (can("board")) html += '<div class="sect label">' + T("nav.streams") + '</div><div class="streams">' +
      GROUPS.map(function (g) {
        var n = TASKS.filter(function (t) { return t.g === g.id && t.s !== "done" && inScope(t); }).length;
        return '<button type="button" data-stream="' + g.id + '"><i style="background:' + g.color + '"></i>' +
          esc(L(g)) + '<span class="c tnum">' + n + "</span></button>";

    rail.innerHTML = html;
    if (rail.dataset.wired) return;
    rail.dataset.wired = "1";
    rail.addEventListener("click", function (e) {

      var st = closestEl(e.target, "[data-stream]");
      if (st) {
        var id = st.dataset.stream;
        state.q = "";

        GROUPS.forEach(function (g) { state.collapsed[g.id] = g.id !== id; });
        go("board");
      }
    });

    var stuck = base.filter(function (t) { return t.s === "block" || t.s === "wait"; });

    var cards = [
      { v: open.length, k: T("kpi.open"), hint: can("all_people") ? T("kpi.open.all") : T("kpi.open.scope"), c: "var(--tide)" },
      { v: dueToday.length, k: T("kpi.today"), hint: T("kpi.today.hint"), c: "var(--coral)" },
      { v: overdue.length, k: T("kpi.overdue"), hint: overdue.length ? overdue.map(function (t) { return person(t.o).name; }).join(", ") : T("kpi.overdue.none"), c: "var(--danger)" },
      { v: stuck.length, k: T("kpi.stuck"), hint: T("kpi.stuck.hint"), c: "var(--st-wait)" },

  var PIN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11 12.3 20a5 5 0 0 1-7-7l9.2-9.2a3.3 3.3 0 0 1 4.7 4.7l-9.2 9.2a1.7 1.7 0 0 1-2.4-2.4l8.5-8.5"/></svg>';
  var CARET = '<svg class="caret2" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  var TICK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>';

  function fmtSize(b) {
    if (b == null) return "";
    if (b < 1024) return b + " B";
    if (b < 1048576) return Math.round(b / 1024) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }
  function fileIcon(name) {
    var ext = (String(name).split(".").pop() || "").toLowerCase();
    var color = "var(--ink-muted)";
    if (ext === "pdf") color = "var(--danger)";
    else if (ext === "xlsx" || ext === "xls" || ext === "csv") color = "var(--success)";
    else if (ext === "doc" || ext === "docx") color = "var(--st-doing)";
    else if (["png", "jpg", "jpeg", "gif", "webp", "heic", "svg"].indexOf(ext) > -1) color = "var(--s-retail)";
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="' + color +
      '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';

  }
  function fileChipRO(f) {
    return '<span class="filechip" title="' + esc(f.name) + '">' +
      (f.url ? '<img src="' + f.url + '" alt="">' : fileIcon(f.name)) +
      '<span class="fname">' + esc(f.name) + "</span>" +
      (f.size ? '<span class="fsize tnum">' + fmtSize(f.size) + "</span>" : "") + "</span>";
  }

  var BUBBLE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>';

  function commentArticle(c, delAttr) {

      '<button class="iconbtn-sm" ' + delAttr + ' aria-label="Delete comment">×</button></header>' +
      '<div class="rtbody">' + contentHtml(c.html) + "</div></article>";

  function subThread(t, sb) {

  function subPanel(t, compact) {
    var rw = canEdit(t);
    var h = '<div class="subpanel' + (compact ? " bare" : "") + '">';
    t.sub.forEach(function (sb) {
      var o = person(sb.o);
      var key = t.id + "|" + sb.id;
      var talking = !!state.subOpen[key];
      h += '<div class="subitem">' +
        '<div class="subrow' + (compact ? " compact" : "") + (sb.done ? " done" : "") + '" data-sub="' + key + '">' +
          '<div class="scell">' +
            '<button class="check sm' + (sb.done ? " on" : "") + '" data-subcheck="' + key +
              '" aria-label="Mark subtask done"' + (rw ? "" : " disabled") + ' aria-pressed="' + !!sb.done + '">' +
              (sb.done ? TICK : "") + "</button>" +
            '<div class="sbody"><span class="stitle">' + content(sb.t) + "</span>" +
            fileRow(sb.files, key) + "</div>" +
          "</div>" +
          "<span></span>" +
          '<button class="owner-cell sm" data-subowner="' + key +
            '" aria-label="Owner: ' + esc(o.full) + '. Reassign">' + avatar(o) +
            '<span class="nm">' + esc(o.name) + "</span></button>" +
          '<div class="subacts">' +
            '<button class="iconbtn-sm' + (talking || sb.comments.length ? " on" : "") + '" data-scom="' + key +
              '" aria-expanded="' + talking + '" aria-label="Comments on this subtask" title="Comments">' +
              BUBBLE + (sb.comments.length ? '<span class="cn tnum">' + sb.comments.length + "</span>" : "") + "</button>" +
            (rw ? '<button class="iconbtn-sm" data-subattach="' + key +

            '<button class="iconbtn-sm" data-subdel="' + key +
              '" aria-label="Delete subtask" title="Delete subtask">×</button>' : "") +
          "</div>" +
        "</div>" +
        (talking ? subThread(t, sb) : "") +
      "</div>";

    if (rw) {
      h += '<form class="addsub" data-addsub="' + t.id + '">' +

        '<button class="btn" type="submit">' + T("sub.addbtn") + "</button></form>";

  }

    var p = person(t.o), pr = prio(t.p), dm = dueMeta(t);
    var rw = canEdit(t), st = status(t.s), ub = businessUnit(t.bu);

    var html = '<div class="titem" data-item="' + t.id + '">' +
      '<div class="row' + (t.s === "done" ? " is-done" : "") + '">' +
      '<div class="task">' +
        (rw ? '<button class="grip" data-grip="' + t.id + '" aria-label="Reorder ' + esc(t.t) +
          '. Drag, or use the arrow keys" title="Drag to reorder">' +
          '<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true">' +
          '<circle cx="4" cy="4" r="1.3"/><circle cx="8" cy="4" r="1.3"/><circle cx="4" cy="8" r="1.3"/>' +
          '<circle cx="8" cy="8" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="8" cy="12" r="1.3"/></svg>' +
        "</button>" : '<span class="grip"></span>') +
        '<button class="check' + (t.s === "done" ? " on" : "") + '" data-check="' + t.id +
          '" aria-label="Mark done"' + (rw ? "" : " disabled") + ' aria-pressed="' + (t.s === "done") + '">' +
          (t.s === "done" ? TICK : "") + "</button>" +
        "<div>" +
          '<button class="task-title" data-open="' + t.id + '"' +

          '<div class="task-meta">' +
            (t.r ? '<span class="chip-repeat"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>' + (t.r === "daily" ? T("chip.daily") : T("chip.weekly")) + "</span>" : "") +
            (t.sub.length || rw ? '<button class="metachip' + (t.sub.length ? "" : " ghost") + '" data-toggle="' + t.id +
              '" aria-expanded="' + open + '">' + CARET +
              esc(t.sub.length ? T("chip.subs", { d: doneN, n: t.sub.length }) : T("chip.addsub")) + "</button>" : "") +
            (t.files.length || rw ? '<button class="metachip' + (t.files.length ? "" : " ghost") + '" data-attach="' + t.id +
              '" title="Attach a document">' + PIN +
              esc(t.files.length ? T("chip.files", { n: t.files.length }) : T("chip.attach")) + "</button>" : "") +
            (talkCount(t) ? '<button class="metachip" data-open="' + t.id + '" title="Open the discussion">' +
              BUBBLE + talkCount(t) + "</button>" : "") +
            (t.n ? '<span class="task-note">' + esc(t.n) + "</span>" : "") +
          "</div>" +
          fileRow(t.files, t.id + "|") +
        "</div>" +
      "</div>" +
      (rw ? buCell(t)

      (rw
        ? '<button class="owner-cell" data-owner="' + t.id + '" aria-label="Owner: ' + esc(p.full) + '. Reassign">' +
          avatar(p) + '<span class="nm">' + esc(p.name) + "</span></button>"
        : '<span class="owner-cell ro">' + avatar(p) + '<span class="nm">' + esc(p.name) + "</span></span>") +
      (rw ? statusCell(t) : '<span class="status ro" style="--sc:' + st.color + '">' + esc(L(st)) + "</span>") +
      '<span class="prio p-' + t.p + '" style="--pc:' + pr.color + '"><i></i>' + esc(L(pr)) + "</span>" +
      '<span class="due tnum ' + dm.cls + '">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
      '<span class="est tnum">' + t.e + " h</span>" +
      "</div>";

    if (open) html += subPanel(t);
    return html + "</div>";
  }

  function renderBoard() {
    var any = false;
    var html = '<div class="scroller"><div class="board">';

    GROUPS.forEach(function (g) {
      var rows = TASKS.filter(function (t) { return t.g === g.id && visible(t); });
      var all = TASKS.filter(function (t) { return t.g === g.id && inScope(t); });
      if (!rows.length && (state.q || activePeople().length)) return;
      any = any || rows.length > 0;
      var doneN = all.filter(function (t) { return t.s === "done"; }).length;
      var blockN = all.filter(function (t) { return t.s === "block"; }).length;
      var lateN = all.filter(isOverdue).length;

      html += '<section class="group' + (state.collapsed[g.id] ? " collapsed" : "") + '" style="--gc:' + g.color + '" data-group="' + g.id + '">' +
        '<header class="group-head">' +
          '<button class="caret" data-collapse="' + g.id + '" aria-expanded="' + !state.collapsed[g.id] + '" aria-label="Collapse ' + esc(g.name) + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
          "</button>" +
          '<span class="tag"></span><h3>' + esc(L(g)) + "</h3>" +
          '<span class="count tnum">' + esc(T("board.tasks", { n: rows.length })) + "</span>" +
          '<div class="mini">' +
            (lateN ? '<span class="dotstat"><i style="background:var(--st-block)"></i>' + esc(T("board.late", { n: lateN })) + "</span>" : "") +
            (blockN ? '<span class="dotstat"><i style="background:var(--st-block)"></i>' + esc(T("board.blocked", { n: blockN })) + "</span>" : "") +
            '<span class="dotstat"><i style="background:var(--st-done)"></i>' + esc(T("board.done", { d: doneN, n: all.length })) + "</span>" +
          "</div>" +
        "</header>" +
        '<div class="cols">' +
          '<span class="label">' + T("col.task") + '</span><span class="label">' + T("col.bu") +
          '</span><span class="label">' + T("col.owner") + '</span><span class="label">' + T("col.status") + "</span>" +
          '<span class="label">' + T("col.priority") + '</span><span class="label">' + T("col.due") +
          '</span><span class="label" style="text-align:right">' + T("col.est") + "</span>" +
        "</div>" +
        '<div class="rows">' + rows.map(taskRow).join("") + "</div>" +
        '<button class="addrow" data-add="' + g.id + '">' + esc(T("board.add", { g: L(g) })) + "</button>" +
      "</section>";
    });

    html += "</div></div>";
    if (!any) html = '<div class="empty">' + T("board.empty") + "</div>";
    document.getElementById("view").innerHTML = html;
    if (state.flash) {
      var fl = document.querySelector('[data-item="' + state.flash + '"]');
      state.flash = null;
      if (fl) {
        fl.classList.add("flash");
        fl.scrollIntoView({ block: "center" });
      }
    }
    restoreFocus();
  }

  function restoreFocus() {
    if (!state.focus) return;
    var f = state.focus, node = null;
    if (f.kind === "grip") node = document.querySelector('[data-grip="' + f.id + '"]');
    if (f.kind === "scomment") {
      var fscope = state.open ? document.getElementById("drawer") : document;
      node = fscope.querySelector('[data-scomment="' + f.id + '"]') ||
        document.querySelector('[data-scomment="' + f.id + '"]');
      state.focus = null;
      if (node) node.focus();
      return;
    }
    if (f.kind === "addsub") {
      var scope = state.open ? document.getElementById("drawer") : document;
      var form = scope.querySelector('[data-addsub="' + f.id + '"]') ||
        document.querySelector('[data-addsub="' + f.id + '"]');
      node = form ? form.querySelector("input") : null;
    }
    state.focus = null;
    if (node) node.focus();
  }

  function weekMeta(t) {
    var bits = [];
    if (t.sub && t.sub.length) {
      var d = t.sub.filter(function (sb) { return sb.done; }).length;
      bits.push(T("week.subs", { d: d, n: t.sub.length }));
    }
    if (t.files && t.files.length) bits.push(T("week.files", { n: t.files.length }));
    var talk = talkCount(t);
    if (talk) bits.push(T("week.comments", { n: talk }));
    var b = businessUnit(t.bu);
    if (b) bits.push(L(b));
    return bits.length ? '<div class="wmeta">' + bits.join(" · ") + "</div>" : "";
  }

  function renderWeek() {
    var me = person(state.me);
    var mine = TASKS.filter(function (t) { return t.o === state.me && visible(t); });
    var buckets = [
      { title: T("week.overdue"), when: T("week.overdue.sub"), alert: true, f: isOverdue },
      { title: T("week.today"), when: T("week.today.sub"), f: function (t) { return days(TODAY, t.d) === 0 && t.s !== "done"; } },
      { title: T("week.next"), when: T("week.next.sub"), f: function (t) { var d = days(TODAY, t.d); return d > 0 && d <= 7 && t.s !== "done"; } },
      { title: T("week.later"), when: T("week.later.sub"), f: function (t) { return days(TODAY, t.d) > 7 && t.s !== "done"; } },
      { title: T("week.closed"), when: "", f: function (t) { return t.s === "done"; } }
    ];

    var html = '<div class="week">';
    var shown = 0;

    if (me.lead) {
      var stuck = TASKS.filter(function (t) { return (t.s === "block" || t.s === "wait") && t.o !== state.me; });
      if (stuck.length) {
        html += '<section class="daycard decide"><header><h3>' + T("week.decide") + "</h3>" +
          '<span class="when">' + T("week.decide.sub") + "</span>" +
          '<span class="tot tnum">' + esc(T("week.items", { n: stuck.length })) + "</span></header>";
        stuck.forEach(function (t) {
          var g = group(t.g), dm = dueMeta(t), o = person(t.o);
          html += '<div class="wrow">' + avatar(o) +
            '<div class="grow"><div class="stream" style="--sc2:' + g.color + '">' + esc(L(g)) + "</div>" +
            '<button class="t wtitle" data-open="' + t.id + '" title="Open details"' +
              (t.color ? ' style="color:' + t.color + '"' : "") + ">" + content(t.t) + "</button>" + weekMeta(t) +
            (t.n ? '<div class="task-meta"><span class="task-note">' + esc(t.n) + "</span></div>" : "") +
            "</div>" +
            '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
            statusCell(t) + "</div>";
        });
        html += "</section>";
      }
    }

    buckets.forEach(function (b) {
      var rows = mine.filter(b.f);
      if (!rows.length) return;
      shown += rows.length;
      var hours = rows.reduce(function (a, t) { return a + t.e; }, 0);
      html += '<section class="daycard' + (b.alert ? " alert" : "") + '"><header><h3>' + b.title + "</h3>" +
        (b.when ? '<span class="when">' + b.when + "</span>" : "") +
        '<span class="tot tnum">' + esc(T("week.tasks", { n: rows.length, h: hours })) + "</span></header>";
      rows.forEach(function (t) {
        var g = group(t.g), dm = dueMeta(t);
        html += '<div class="wrow">' +
          '<button class="check' + (t.s === "done" ? " on" : "") + '" data-check="' + t.id + '" aria-label="Mark done"></button>' +
          '<div class="grow"><div class="stream" style="--sc2:' + g.color + '">' + esc(L(g)) + "</div>" +
          '<button class="t wtitle" data-open="' + t.id + '" title="Open details"' +
            (t.color ? ' style="color:' + t.color + '"' : "") + ">" + content(t.t) + "</button>" +
          weekMeta(t) + "</div>" +
          '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
          statusCell(t) + "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    if (!shown) html += '<div class="empty">' + esc(T("week.empty", { name: me.name })) + "</div>";

  function renderPeople() {

      var mine = TASKS.filter(function (t) { return t.o === p.id && t.s !== "done"; });
      var byStatus = {};

  function addDays(iso, n) {

  // ---------- Home ----------
  function renderHome() {
    var now = TASKS.filter(function (t) { return t.s !== "done" && inScope(t) && days(TODAY, t.d) <= 0; })
      .sort(function (a, b) { return Date.parse(a.d) - Date.parse(b.d); });
    var stuck = TASKS.filter(function (t) { return (t.s === "block" || t.s === "wait") && inScope(t); });
    var mine = TASKS.filter(function (t) { return t.o === state.me && t.s !== "done"; })
      .sort(function (a, b) { return Date.parse(a.d) - Date.parse(b.d); }).slice(0, 5);
    var risk = PROJECTS.filter(function (pr) { return pr.health !== "on"; });

    var streams = GROUPS.map(function (g) {
      var all = TASKS.filter(function (t) { return t.g === g.id && inScope(t); });
      var done = all.filter(function (t) { return t.s === "done"; }).length;
      var pct = all.length ? Math.round((done / all.length) * 100) : 0;
      return '<div class="progline" style="--sc:' + g.color + '">' +
        '<span><i class="dot"></i>' + esc(g.name) + "</span>" +

          : '<p class="cempty">Nothing due today. Rare, and worth enjoying.</p>') +

        (days(TODAY, iso) < 0 ? " past" : "");

            '<span class="ct">' + content(t.t) + "</span>" + avatar(person(t.o)) + "</button>";

  // ---------- Reports ----------

    { w: "W33", n: 16 }, { w: "W34", n: 12 }

    var streamRows = GROUPS.map(function (g) {

    }).sort(function (a, b) { return b.h - a.h; });

    var peopleBars = peopleRows.map(function (r) {

        '<span class="track"><i style="width:' + ((r.h / maxP) * 100) + '%"></i></span>' +

    var buBars = buRows.map(function (r) {
      return '<div class="hbar" style="--sc:' + r.color + '"><span>' + esc(r.name) + "</span>" +
        '<span class="track"><i style="width:' + ((r.h / maxBu) * 100) + '%"></i></span>' +
        '<span class="num tnum">' + r.h + " h</span></div>";

    document.getElementById("view").innerHTML = '<div class="repgrid">' +
      card(T("rep.stands"), T("rep.tasks", { n: base.length }), mixBar) +

  // ---------- translating what people write ----------
  var TCACHE = {};
  var TPENDING = {};
  var trQueue = [];
  var trTimer = null;
  var samplePromise = null;

  function isThai(txt) { return /[฀-๿]/.test(txt || ""); }
  function langOf(txt) { return isThai(txt) ? "th" : "en"; }

  function getSample() {
    if (!samplePromise) {
      samplePromise = (window.claude && claude.use)
        ? claude.use("sample").catch(function () { return null; })
        : Promise.resolve(null);
    }
    return samplePromise;
  }

  function queueTr(text) {
    var key = state.lang + "|" + text;
    if (TCACHE[key] !== undefined || TPENDING[key]) return;
    TPENDING[key] = true;
    trQueue.push({ text: text, target: state.lang });
    if (trTimer) clearTimeout(trTimer);
    trTimer = setTimeout(flushTr, 250);
  }

  function flushTr() {
    var batch = trQueue.splice(0, 30);
    if (!batch.length) return;
    var target = batch[0].target;
    var texts = batch.map(function (b) { return b.text; });
    function settle(map) {
      batch.forEach(function (b, i) {
        var key = b.target + "|" + b.text;
        var v = map ? (map[String(i)] || map[i]) : null;
        TCACHE[key] = (typeof v === "string" && v) ? v : null;
        delete TPENDING[key];
      });
      refresh();
    }
    getSample().then(function (ns) {
      if (!ns) { settle(null); return; }
      ns.json(
        "You are the translation layer of a seafood company's task board. Translate each string into " +
          (target === "th" ? "Thai" : "English") + ".\n" +
          "Rules: keep any HTML tags and inline styles exactly as they are and translate only the text between them; " +
          "leave people's names, product names, codes, numbers and dates unchanged; keep it short and plain, the way a colleague writes.\n" +
          "Answer with a JSON object mapping the index of each input to its translation, for example {\"0\": \"...\"}.\n\n" +
          "Input strings:\n" + JSON.stringify(texts),
        { modelTier: "quick", cache: true }
      ).then(settle, function () { settle(null); });
    }, function () { settle(null); });
  }

  function trMark(from) {
    var lbl = T(from === "th" ? "tr.from.th" : "tr.from.en");
    return ' <span class="trmark" title="' + esc(lbl) + '">⇄ ' + esc(lbl) + "</span>";
  }

  function content(text) {
    if (!text) return "";
    if (!state.autotr) return esc(text);
    var from = langOf(text);
    if (from === state.lang) return esc(text);
    var key = state.lang + "|" + text;
    if (TCACHE[key]) return esc(TCACHE[key]) + trMark(from);
    if (TCACHE[key] === null) return esc(text);
    queueTr(text);
    return esc(text) + ' <span class="trmark working">' + T("tr.working") + "</span>";
  }

  function contentHtml(html) {
    if (!html) return "";
    if (!state.autotr) return html;
    var from = langOf(plain(html));
    if (from === state.lang) return html;
    var key = state.lang + "|" + html;
    if (TCACHE[key]) return clean(TCACHE[key]) + '<p class="trline">' + trMark(from) + "</p>";
    if (TCACHE[key] === null) return html;
    queueTr(html);
    return html + '<p class="trline"><span class="trmark working">' + T("tr.working") + "</span></p>";
  }

  function trAside(text) {
    if (!text || !state.autotr) return "";
    var from = langOf(text);
    if (from === state.lang) return "";
    var key = state.lang + "|" + text;
    if (TCACHE[key]) return '<p class="trline">' + esc(TCACHE[key]) + trMark(from) + "</p>";
    if (TCACHE[key] === null) return "";
    queueTr(text);
    return '<p class="trline"><span class="trmark working">' + T("tr.working") + "</span></p>";
  }

  var TSEED = [
    ["Replace the chiller-room door seal", "เปลี่ยนซีลประตูห้องเย็น"],
    ["<p>ปิดห้องเย็นได้ตอนตี 4 ก่อนของเข้า จะได้ไม่กระทบไลน์ผลิต</p>",

  // ---------- notifications ----------
  function plain(html) {

  function actorName() {

  function recipients(t, sb, actorId) {
    var ids = [];
    function add(id) { if (id && ids.indexOf(id) === -1 && id !== actorId) ids.push(id); }
    add(t.o);
    if (sb) add(sb.o);
    t.comments.forEach(function (c) { add(c.o); });
    t.sub.forEach(function (x) { (x.comments || []).forEach(function (c) { add(c.o); }); });
    return ids;
  }

  function notify(t, kind, key, args, body, sb, extra) {
    if (!t || !NOTIFY[kind]) return;
    var a = session();
    var actorId = a ? a.p : null;
    var ids = recipients(t, sb, actorId);
    if (extra && ids.indexOf(extra) === -1 && extra !== actorId) ids.push(extra);
    var sent = [];
    ids.forEach(function (pid) {
      var acc = account(pid);
      if (!acc || acc.status !== "active") return;
      var any = false;
      CHANNELS.forEach(function (ch) {
        if (!NOTIFY_CH[ch.id] || acc.channels[ch.id] === false) return;
        any = true;
        OUTBOX.unshift({
          id: "m" + (msgSeq++), ch: ch.id, to: pid, at: "Just now", kind: kind, task: t.id,
          stream: t.g, title: t.t, k: key, args: args || {}, body: body || ""
        });
      });
      if (any) sent.push(person(pid).name);
    });
    if (sent.length) toast(T("n.notified", { head: T(key, args), who: sent.join(", ") }));
  }

    var ed = host && host.closest ? host.closest("[contenteditable]") : null;

  function clean(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    var nodes = d.querySelectorAll("*");
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      if (/^(script|style|iframe|object|embed|link|meta|form)$/i.test(n.tagName)) { n.parentNode.removeChild(n); continue; }
      if (n.tagName === "SPAN" && /background-color:\s*(transparent|rgba\(0, 0, 0, 0\))/i.test(n.getAttribute("style") || "")) {
        n.style.backgroundColor = "";
        if (!n.getAttribute("style")) {
          while (n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
          n.parentNode.removeChild(n);
          continue;
        }
      }
      for (var j = n.attributes.length - 1; j >= 0; j--) {
        var a = n.attributes[j].name;
        if (a.indexOf("on") === 0) n.removeAttribute(a);
        if (a === "href" && /^\s*javascript:/i.test(n.getAttribute("href") || "")) n.removeAttribute(a);
      }
    }
    return d.innerHTML;
  }

    dr.innerHTML =
      '<header class="dhead"><span class="streamtag" style="--sc:' + g.color + '"><i></i>' + esc(g.name) + "</span>" +
        '<button class="btn" data-showboard="' + t.id + '" style="margin-left:auto;padding:4px 10px;font-size:12px">' +
          T("drawer.showboard") + "</button>" +
        '<button class="iconbtn-sm" data-dclose aria-label="Close">×</button></header>' +
      '<div class="dbody">' +
        "<div>" +
          '<h2 class="dtitle" contenteditable="' + (rw ? "true" : "false") + '" data-dtitle' +
            (t.color ? ' style="color:' + t.color + '"' : "") + ">" + esc(t.t) + "</h2>" +
          trAside(t.t) + (rw ? swatches : "") +
        "</div>" +
        meta +
        '<section class="dsec"><h3>' + T("drawer.desc") + "</h3>" +
          '<div class="rt">' + (rw ? rtToolbar() : "") +
          '<div class="rtarea" data-desc contenteditable="' + (rw ? "true" : "false") +
            '" data-ph="' + T("drawer.descph") + '">' + t.desc + "</div></div>" + trAside(plain(t.desc)) + "</section>" +
        '<section class="dsec"><h3>' + T("drawer.subs") + ' <span class="n tnum">' + doneN + " / " + t.sub.length + "</span></h3>" +
          subPanel(t, true) + "</section>" +
        '<section class="dsec"><h3>' + T("drawer.docs") + ' <span class="n tnum">' + t.files.length + "</span></h3>" +
          (rw ? '<div class="dropbox" data-dropzone="' + t.id + '">' + T("docs.drop") +
            '<br><button class="btn" data-attach="' + t.id + '">' + T("docs.choose") + "</button></div>" : "") +
          fileRow(t.files, t.id + "|") + "</section>" +
        '<section class="dsec"><h3>' + T("drawer.comments") + ' <span class="n tnum">' + t.comments.length + "</span></h3>" +
          comments +
          '<div class="composer"><div class="rt">' + rtToolbar() +
            '<div class="rtarea" data-comment contenteditable="true" data-ph="' + T("comment.ph") + '">' +
            (state.draft[t.id] || "") + "</div></div>" +
            '<div class="crow"><span class="hint">' + T("comment.hint") + "</span>" +
            '<button class="btn btn-primary" data-cpost="' + t.id + '">' + T("comment.post") + "</button></div></div>" +
        "</section>" +
      "</div>";

    dr.hidden = false;
    scrim.hidden = false;
  }

  // ---------- lookups, files, drag and drop ----------
  function closestEl(node, sel) {
    var n = node && node.nodeType === 3 ? node.parentNode : node;
    return n && n.closest ? n.closest(sel) : null;
  }
  function findTask(id) {
    for (var i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) return TASKS[i];
    return null;
  }
  function findSub(taskId, subId) {
    var t = findTask(taskId);
    if (!t) return null;
    for (var i = 0; i < t.sub.length; i++) if (t.sub[i].id === subId) return t.sub[i];
    return null;
  }
  function addFiles(host, list) {
    if (!host || !list || !list.length) return;
    if (!host.files) host.files = [];
    for (var i = 0; i < list.length; i++) {
      var f = list[i], rec = { name: f.name, size: f.size };
      if (f.type && f.type.indexOf("image/") === 0 && window.URL && URL.createObjectURL) {
        try { rec.url = URL.createObjectURL(f); } catch (err) { /* preview is optional */ }
      }
      host.files.push(rec);
    }
  }

  var picker = document.createElement("input");
  picker.type = "file";
  picker.multiple = true;
  picker.style.display = "none";
  document.body.appendChild(picker);
  var pickTarget = null;
  function pickFilesFor(taskId, subId) {
    pickTarget = { task: taskId, sub: subId };
    picker.click();
  }
  picker.addEventListener("change", function () {
    if (pickTarget && picker.files && picker.files.length) {
      addFiles(pickTarget.sub ? findSub(pickTarget.task, pickTarget.sub) : findTask(pickTarget.task), picker.files);
      notify(findTask(pickTarget.task), "files", "n.files",
        { who: actorName(), what: T("n.docs", { n: picker.files.length }) },
        "", pickTarget.sub ? findSub(pickTarget.task, pickTarget.sub) : null);
      state.expanded[pickTarget.task] = state.expanded[pickTarget.task] || !!pickTarget.sub;
      refresh();
    }
    picker.value = "";
    pickTarget = null;
  });

  // new subtask
  document.addEventListener("submit", function (e) {
    if (closestEl(e.target, "[data-signin]")) {
      e.preventDefault();
      signIn(document.getElementById("g-email").value);
      return;
    }
    if (closestEl(e.target, "[data-request]")) {
      e.preventDefault();
      var nm = document.getElementById("g-name").value.trim();
      var ml = document.getElementById("g-mail").value.trim();
      if (!nm || !ml) return;
      REQUESTS.push({
        id: "r" + Date.now(), name: nm, email: ml,
        role: document.getElementById("g-role").value,
        note: document.getElementById("g-note").value.trim(),
        at: "Just now"
      });
      state.gate = "sent";
      renderGate();
      return;
    }
    var form = closestEl(e.target, "[data-addsub]");
    if (!form) return;
    e.preventDefault();
    var t = findTask(form.dataset.addsub);
    var input = form.querySelector("input");
    var title = input.value.trim();
    if (!t || !title) return;
    t.sub.push({ id: "s" + Date.now(), t: title, o: t.o, done: false, files: [], comments: [] });
    notify(t, "subtask", "n.subadd", { who: actorName(), what: title });
    state.focus = { kind: "addsub", id: t.id };
    refresh();
  });

  document.addEventListener("input", function (e) {
    var ti = closestEl(e.target, "[data-dtitle]");
    if (ti) {
      var t = findTask(state.open);
      if (t) t.t = ti.textContent.replace(/\s+/g, " ").trim() || t.t;
      return;
    }
    if (closestEl(e.target, "[data-desc]") || closestEl(e.target, "[data-comment]") ||
        closestEl(e.target, "[data-scomment]")) saveEditors();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      var sbox = closestEl(e.target, "[data-scomment]");
      if (sbox) { e.preventDefault(); postSubComment(sbox.getAttribute("data-scomment")); return; }
      if (closestEl(e.target, "[data-comment]")) {
        e.preventDefault();
        if (state.open) postComment(state.open);
        return;
      }
    }
    if (e.key === "Enter" && closestEl(e.target, "[data-dtitle]")) { e.preventDefault(); e.target.blur(); }
  });

  document.addEventListener("focusout", function (e) {
    if (closestEl(e.target, "[data-dtitle]")) laterRefresh();
  });

  // reorder: drag from the grip, or move with the arrow keys while it has focus
  var dragId = null;
  function clearMarks() {
    var marked = document.querySelectorAll(".dropbefore, .dropafter, .filedrop");
    for (var i = 0; i < marked.length; i++) marked[i].classList.remove("dropbefore", "dropafter", "filedrop");
  }
  function clearDraggable() {
    var d = document.querySelectorAll('.titem[draggable="true"]');
    for (var i = 0; i < d.length; i++) d[i].draggable = false;
  }
  function moveTask(id, targetId, after, groupId) {
    var from = -1, i;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) from = i;
    if (from < 0) return;
    var t = TASKS.splice(from, 1)[0];
    if (groupId) t.g = groupId;
    var to = -1;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === targetId) to = i;
    if (to < 0) TASKS.push(t);
    else TASKS.splice(after ? to + 1 : to, 0, t);
  }
  function moveToGroupEnd(id, groupId) {
    var from = -1, i, last = -1;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) from = i;
    if (from < 0) return;
    var t = TASKS.splice(from, 1)[0];
    t.g = groupId;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].g === groupId) last = i;
    TASKS.splice(last + 1, 0, t);
  }
  function nudge(id, dir) {
    var t = findTask(id);
    if (!t) return;
    var idx = [], i;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].g === t.g && visible(TASKS[i])) idx.push(i);
    var pos = idx.indexOf(TASKS.indexOf(t));
    var swap = idx[pos + dir];
    if (swap === undefined) return;
    var a = TASKS.indexOf(t);
    TASKS[a] = TASKS[swap];
    TASKS[swap] = t;
  }

  document.addEventListener("mousedown", function (e) {
    if (closestEl(e.target, "[data-cmd]")) { e.preventDefault(); return; }
    var g = closestEl(e.target, "[data-grip]");
    if (g) { var it = closestEl(g, ".titem"); if (it) it.draggable = true; }
  });
  document.addEventListener("mouseup", clearDraggable);

  document.addEventListener("dragstart", function (e) {
    var it = closestEl(e.target, ".titem");
    if (!it || !it.draggable) return;
    dragId = it.dataset.item;
    it.classList.add("dragging");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* Safari */ }
    }
  });
  document.addEventListener("dragend", function () {
    dragId = null;
    clearMarks();
    clearDraggable();
    var d = document.querySelectorAll(".dragging");
    for (var i = 0; i < d.length; i++) d[i].classList.remove("dragging");
  });

  function hasFiles(dt) {
    if (!dt || !dt.types) return false;
    for (var i = 0; i < dt.types.length; i++) if (dt.types[i] === "Files") return true;
    return false;
  }

  document.addEventListener("dragover", function (e) {
    var item = closestEl(e.target, ".titem");
    var sub = closestEl(e.target, ".subrow");
    var box = closestEl(e.target, "[data-dropzone]");
    if (hasFiles(e.dataTransfer)) {
      e.preventDefault();
      clearMarks();
      var zone = sub || box || item;
      if (zone) { e.dataTransfer.dropEffect = "copy"; zone.classList.add("filedrop"); }
      return;
    }
    if (!dragId) return;
    clearMarks();
    if (item && item.dataset.item !== dragId) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var r = item.getBoundingClientRect();
      item.classList.add(e.clientY > r.top + r.height / 2 ? "dropafter" : "dropbefore");
    } else if (closestEl(e.target, ".group")) {
      e.preventDefault();
    }
  });

  document.addEventListener("drop", function (e) {
    var item = closestEl(e.target, ".titem");
    var sub = closestEl(e.target, ".subrow");
    var grp = closestEl(e.target, ".group");

    if (hasFiles(e.dataTransfer)) {
      e.preventDefault();
      clearMarks();
      var box2 = closestEl(e.target, "[data-dropzone]");
      var dropped = T("n.docs", { n: e.dataTransfer.files.length });
      if (sub) {
        var q = sub.dataset.sub.split("|"), dsb = findSub(q[0], q[1]);
        addFiles(dsb, e.dataTransfer.files);
        notify(findTask(q[0]), "files", "n.files.sub", { who: actorName(), what: dropped, sub: dsb.t }, "", dsb);
        refresh();
      } else if (box2) {
        addFiles(findTask(box2.dataset.dropzone), e.dataTransfer.files);
        notify(findTask(box2.dataset.dropzone), "files", "n.files", { who: actorName(), what: dropped });
        refresh();
      } else if (item) {
        addFiles(findTask(item.dataset.item), e.dataTransfer.files);
        notify(findTask(item.dataset.item), "files", "n.files", { who: actorName(), what: dropped });
        refresh();
      }
      return;
    }

    if (!dragId) return;
    e.preventDefault();
    if (item && item.dataset.item !== dragId) {
      var r = item.getBoundingClientRect();
      moveTask(dragId, item.dataset.item, e.clientY > r.top + r.height / 2, grp ? grp.dataset.group : null);
    } else if (grp) {
      moveToGroupEnd(dragId, grp.dataset.group);
    }
    dragId = null;
    clearMarks();
    clearDraggable();
    render();
  });

  document.addEventListener("keydown", function (e) {
    var g = closestEl(e.target, "[data-grip]");
    if (!g || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
    e.preventDefault();
    nudge(g.dataset.grip, e.key === "ArrowUp" ? -1 : 1);
    state.focus = { kind: "grip", id: g.dataset.grip };
    renderBoard();
  });

  normaliseSubs();
  normaliseAccounts();
  warmTranslations();
  renderRail();
  render();
})();
</script>
