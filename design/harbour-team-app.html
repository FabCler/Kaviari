<title>Thammachart Harbour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
  :root {
    /* Deep sea → ice */
    --sea-900: #07333d;
    --sea-800: #0b4552;
    --tide: #0f7383;
    --tide-600: #0c5f6d;
    --tide-wash: #e2eff0;
    --coral: #e0664a;
    --coral-deep: #c14a30;

    --bg: #eef3f2;
    --surface: #ffffff;
    --surface-2: #f5f8f7;
    --ink: #10262c;
    --ink-2: #3c5158;
    --ink-muted: #63797f;
    --line: #d9e3e2;
    --line-soft: #e8efee;

    --bar-ink: #d3e4e4;
    --bar-ink-dim: rgba(211, 228, 228, 0.6);

    /* Status */
    --st-todo: #6b7b82;
    --st-doing: #2f7fa8;
    --st-wait: #b8791b;
    --st-block: #c2412f;
    --st-done: #177a5e;
    --st-ink: #ffffff;

    /* Streams — categorical, separated for CVD */
    --s-ops: #0f7383;
    --s-retail: #7b57c9;
    --s-food: #b04a8a;
    --s-source: #2f6fb5;
    --s-quality: #2f7d4a;
    --s-intake: #c2681f;

    --danger: #c2412f;
    --warning: #a86e10;
    --success: #177a5e;

    --radius: 10px;
    --shadow: 0 1px 2px rgb(7 51 61 / 0.05), 0 10px 26px -18px rgb(7 51 61 / 0.4);
    --row-cols: minmax(300px, 1fr) 152px 150px 116px 128px 78px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sea-900: #05202a;
      --sea-800: #0a3340;
      --tide: #38a6b8;
      --tide-600: #2b8b9b;
      --tide-wash: rgba(56, 166, 184, 0.14);
      --coral: #f0836a;
      --coral-deep: #e0664a;

      --bg: #06222a;
      --surface: #0d323c;
      --surface-2: #113c48;
      --ink: #e6f0ef;
      --ink-2: #b3c8cb;
      --ink-muted: #8ba3a8;
      --line: rgba(178, 216, 218, 0.16);
      --line-soft: rgba(178, 216, 218, 0.09);

      --bar-ink: #cfe3e3;
      --bar-ink-dim: rgba(207, 227, 227, 0.58);

      --st-todo: #7e8f96;
      --st-doing: #4796bd;
      --st-wait: #cf9226;
      --st-block: #db6150;
      --st-done: #2e9a78;
      --st-ink: #04191f;

      --s-ops: #3ea7b7;
      --s-retail: #a68ae0;
      --s-food: #dd7ab6;
      --s-source: #5f9ce0;
      --s-quality: #4faa73;
      --s-intake: #e0904a;

      --danger: #e2705e;
      --warning: #d3a03a;
      --success: #3ea583;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 30px -20px rgb(0 0 0 / 0.8);
    }
  }

  :root[data-theme="dark"] {
    --sea-900: #05202a;
    --sea-800: #0a3340;
    --tide: #38a6b8;
    --tide-600: #2b8b9b;
    --tide-wash: rgba(56, 166, 184, 0.14);
    --coral: #f0836a;
    --coral-deep: #e0664a;

    --bg: #06222a;
    --surface: #0d323c;
    --surface-2: #113c48;
    --ink: #e6f0ef;
    --ink-2: #b3c8cb;
    --ink-muted: #8ba3a8;
    --line: rgba(178, 216, 218, 0.16);
    --line-soft: rgba(178, 216, 218, 0.09);

    --bar-ink: #cfe3e3;
    --bar-ink-dim: rgba(207, 227, 227, 0.58);

    --st-todo: #7e8f96;
    --st-doing: #4796bd;
    --st-wait: #cf9226;
    --st-block: #db6150;
    --st-done: #2e9a78;
    --st-ink: #04191f;

    --s-ops: #3ea7b7;
    --s-retail: #a68ae0;
    --s-food: #dd7ab6;
    --s-source: #5f9ce0;
    --s-quality: #4faa73;
    --s-intake: #e0904a;

    --danger: #e2705e;
    --warning: #d3a03a;
    --success: #3ea583;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 30px -20px rgb(0 0 0 / 0.8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }

  :where(a, button, input, select, [tabindex]):focus-visible {
    outline: 2px solid var(--coral);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .tnum { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 16px;
    height: 54px; padding: 0 18px;
    background: var(--sea-900);
    color: var(--bar-ink);
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg, var(--tide), var(--coral) 65%, var(--sea-800)) 1;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand .mark {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: #fff;
  }
  .brand .mark em { color: var(--coral); font-style: normal; }
  .brand .org { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bar-ink-dim); white-space: nowrap; }
  .topbar .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.1);
    border-radius: 99px; padding: 4px 11px; font-size: 12px; color: var(--bar-ink); cursor: pointer;
  }
  .topbar .chip:hover { background: rgb(255 255 255 / 0.14); }
  .topbar .spacer { flex: 1; }
  .topbar .iconbtn {
    border: 0; background: rgb(255 255 255 / 0.07); color: var(--bar-ink);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .topbar .iconbtn:hover { background: rgb(255 255 255 / 0.15); }
  .topbar .me { display: flex; align-items: center; gap: 9px; }
  .topbar .me span.n { font-size: 12.5px; color: var(--bar-ink); }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }

  .rail {
    position: sticky; top: 54px;
    height: calc(100dvh - 54px);
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .rail .sect { padding: 14px 10px 6px; }
  .rail a {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; border-radius: 8px;
    font-size: 13.5px; color: var(--ink-2); text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .rail a:hover { background: var(--surface-2); color: var(--ink); }
  .rail a[aria-current="page"] { background: var(--tide-wash); color: var(--tide-600); font-weight: 600; }
  .rail a .ico { width: 17px; height: 17px; flex: none; opacity: 0.75; }
  .rail a[aria-current="page"] .ico { opacity: 1; color: var(--tide); }
  .rail a .badge {
    margin-left: auto; font-size: 11px; font-weight: 600;
    background: var(--coral); color: #fff; border-radius: 99px; padding: 0 6px;
  }
  .rail .streams { display: flex; flex-direction: column; gap: 1px; }
  .rail .streams button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 0; background: none; cursor: pointer; text-align: left;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2);
  }
  .rail .streams button:hover { background: var(--surface-2); color: var(--ink); }
  .rail .streams i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .rail .streams .c { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }

  main { min-width: 0; padding: 26px 30px 60px; }

  /* ---------- Page head ---------- */
  .pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; justify-content: space-between; }
  .pagehead h1 {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 34px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05;
    text-wrap: balance;
  }
  .pagehead .sub { margin-top: 5px; color: var(--ink-muted); font-size: 13px; }
  .headtools { display: flex; align-items: center; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-muted); }
  .btn-primary { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--coral-deep); border-color: var(--coral-deep); }

  /* ---------- KPI strip ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--kpi-color, var(--line)); }
  .kpi .v { font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .kpi .k { margin-top: 1px; }
  .kpi .hint { margin-top: 5px; font-size: 11.5px; color: var(--ink-muted); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin-top: 24px; padding-bottom: 11px; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 3px; }
  .tab {
    border: 0; background: none; padding: 7px 12px 10px; cursor: pointer;
    color: var(--ink-muted); font-size: 13.5px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -12px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--coral); }
  .tab .n { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--ink-muted); font-weight: 600; border: 1px solid var(--line-soft); }
  .tab[aria-selected="true"] .n { background: var(--tide-wash); color: var(--tide-600); border-color: transparent; }

  .spacer { flex: 1; }

  .search { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .search input { border: 0; background: none; outline: none; color: inherit; font-size: 13px; width: 168px; }
  .search input::placeholder { color: var(--ink-muted); }

  .facepile { display: flex; align-items: center; gap: 5px; }
  .facepile .avatar-btn {
    border: 0; padding: 0; background: none; cursor: pointer; border-radius: 99px; line-height: 0;
    opacity: 0.4; transition: opacity 0.15s ease;
  }
  .facepile .avatar-btn:hover { opacity: 0.8; }
  .facepile .avatar-btn.on { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--coral); }

  .toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--tide); width: 15px; height: 15px; }

  /* ---------- Avatars ---------- */
  .avatar {
    width: 26px; height: 26px; border-radius: 99px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: #fff; flex: none;
  }
  .avatar.lg { width: 34px; height: 34px; font-size: 12px; }
  .avatar.lead { box-shadow: inset 0 0 0 1.5px var(--coral); }

  /* ---------- Board ---------- */
  .scroller { overflow-x: auto; margin-top: 18px; padding-bottom: 4px; }
  .board { min-width: 900px; display: flex; flex-direction: column; gap: 18px; }

  .group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 15px; }
  .group-head .caret { border: 0; background: none; cursor: pointer; color: var(--ink-muted); padding: 2px; line-height: 0; transition: transform 0.18s ease; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .tag { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); flex: none; }
  .group-head h3 { font-size: 14.5px; font-weight: 600; color: var(--gc); }
  .group-head .count { font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini .dotstat { display: inline-flex; align-items: center; gap: 5px; }
  .group-head .mini i { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }

  .cols, .row { display: grid; grid-template-columns: var(--row-cols); align-items: center; column-gap: 12px; }
  .cols { padding: 7px 15px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }
  .group.collapsed .cols, .group.collapsed .rows { display: none; }

  .row { padding: 9px 15px; border-top: 1px solid var(--line-soft); transition: background-color 0.12s ease; }
  .row:hover { background: var(--surface-2); }
  .row.is-done .task-title { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .task { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .check {
    width: 17px; height: 17px; margin-top: 2px; flex: none;
    border-radius: 5px; border: 1.5px solid var(--line); background: var(--surface);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .check:hover { border-color: var(--st-done); }
  .check.on { background: var(--st-done); border-color: var(--st-done); color: #fff; }
  .task-title {
    font-size: 13.5px; line-height: 1.35; text-align: left; display: block;
    border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit; color: inherit;
  }
  .task-title:hover { text-decoration: underline; text-underline-offset: 2px; }
  .task-meta { margin-top: 3px; min-height: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-muted); }
  .chip-repeat { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px 0 5px; height: 17px; color: var(--ink-2); }
  .task-note { color: var(--danger); }

  .owner-cell { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 3px 5px; border-radius: 8px; cursor: pointer; min-width: 0; text-align: left; }
  .owner-cell:hover { background: var(--line-soft); }
  .owner-cell .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status {
    border: 0; cursor: pointer; width: 100%; height: 29px; border-radius: 6px;
    color: var(--st-ink); background: var(--sc);
    font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    transition: filter 0.15s ease;
  }
  .status:hover { filter: brightness(1.08); }

  .prio { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .prio i { width: 3px; height: 13px; border-radius: 2px; background: var(--pc); display: inline-block; }
  .prio.p-critical { color: var(--danger); font-weight: 600; }
  .prio.p-high { font-weight: 600; }
  .prio.p-low { color: var(--ink-muted); }

  .due { font-size: 12.5px; }
  .due small { display: block; font-size: 10.5px; color: var(--ink-muted); }
  .due.overdue { color: var(--danger); font-weight: 600; }
  .due.overdue small { color: var(--danger); opacity: 0.85; }
  .due.today { color: var(--tide-600); font-weight: 600; }

  .est { font-size: 12.5px; color: var(--ink-muted); text-align: right; }

  .addrow {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 15px 11px 34px; border-top: 1px solid var(--line-soft);
    color: var(--ink-muted); font-size: 12.5px;
    border-width: 0; background: none; cursor: pointer; width: 100%;
  }
  .addrow:hover { color: var(--ink); background: var(--surface-2); }
  .group.collapsed .addrow { display: none; }

  .empty { padding: 40px 16px; text-align: center; color: var(--ink-muted); font-size: 13px; }

  /* ---------- Task drawer, rich text, comments ---------- */
  .scrim { position: fixed; inset: 0; background: rgb(7 51 61 / 0.42); z-index: 70; }
  /* an author display value would otherwise beat the hidden attribute */
  .scrim[hidden], .drawer[hidden] { display: none !important; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100dvh; width: min(560px, 100vw); z-index: 71;
    background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: -20px 0 52px -26px rgb(7 51 61 / 0.55);
    display: flex; flex-direction: column;
  }
  .dhead { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line-soft); }
  .streamtag { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--sc); }
  .streamtag i { width: 9px; height: 9px; border-radius: 3px; background: var(--sc); }
  .dhead .iconbtn-sm { margin-left: auto; font-size: 17px; }
  .dbody { overflow-y: auto; padding: 16px 18px 44px; display: flex; flex-direction: column; gap: 18px; }
  .dtitle {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 22px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em;
    outline: none; border-radius: 8px; padding: 3px 5px; margin: -3px -5px;
  }
  .dtitle:focus { background: var(--bg); box-shadow: 0 0 0 2px var(--tide); }
  .colorrow { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
  .colorrow .lbl { font-size: 11px; color: var(--ink-muted); margin-right: 2px; }
  .swatchbtn { width: 19px; height: 19px; border-radius: 99px; border: 2px solid transparent; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12); }
  .swatchbtn.on { border-color: var(--ink); }
  .swatchbtn.none { background: var(--surface); position: relative; }
  .swatchbtn.none::after { content: ""; position: absolute; inset: 3px; border-top: 1.5px solid var(--danger); transform: rotate(45deg); }

  .dmeta { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 9px 12px; align-items: center; font-size: 13px; }
  .dmeta .k { color: var(--ink-muted); font-size: 12px; }
  .dmeta .status { width: 148px; }
  .dmeta input[type="date"], .dmeta input[type="number"] {
    border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 8px;
    font: inherit; font-size: 13px; color: inherit; width: 168px;
  }
  .dsec > h3 { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; margin-bottom: 9px; display: flex; align-items: center; gap: 8px; }
  .dsec > h3 .n { color: var(--ink-2); }

  .rt { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .rttoolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 5px 6px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .rtbtn { width: 27px; height: 26px; border: 0; background: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; }
  .rtbtn:hover { background: var(--line-soft); color: var(--ink); }
  .rtbtn b { font-weight: 700; }
  .rtbtn i { font-style: italic; font-family: Georgia, serif; }
  .rtbtn u { text-decoration: underline; }
  .rtbtn s { text-decoration: line-through; }
  .rtsep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; }
  .rtcolor { width: 17px; height: 17px; border-radius: 99px; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.15); }
  .rtarea { padding: 10px 12px; min-height: 78px; font-size: 13.5px; line-height: 1.55; outline: none; }

      return '<a href="#" data-page="' + n.page + '"' + (state.page === n.page ? ' aria-current="page"' : "") + ">" +
        svg + n.label + (badge ? '<span class="badge tnum">' + badge + "</span>" : "") + "</a>";
    }).join("");

    html += '<div class="sect label">Streams</div><div class="streams">' +
      GROUPS.map(function (g) {
        var n = TASKS.filter(function (t) { return t.g === g.id && t.s !== "done"; }).length;

  function renderKpis() {

      { v: stuck.length, k: "Blocked / waiting", hint: "needs a decision", c: "var(--st-wait)" },
      { v: done.length, k: "Done this week", hint: "since Monday", c: "var(--success)" }

      return '<article class="kpi" style="--kpi-color:' + c.c + '">' +
        '<div class="v tnum">' + c.v + "</div>" +
        '<div class="k label">' + c.k + "</div>" +
        '<div class="hint">' + esc(c.hint) + "</div></article>";

  var PAGES = {

      },

    board: {
      title: function () { return "Team board"; },
      sub: function () { return "Week of 24 – 28 August 2026 · " + PEOPLE.length + " people · " + GROUPS.length + " streams"; },

    },
    mywork: {
      title: function () { return "My work"; },

    },
    projects: {

    },
    calendar: {

      sub: function () { return "Three weeks from Monday 24 August · tasks sit on their due date"; },
      kpis: false, filters: true, tools: ["task"], render: function () { renderCalendar(); }
    },
    people: {
