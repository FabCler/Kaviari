      sub: function () { return PEOPLE.length + " people · capacity " + state.capacity + " h a week"; },
      kpis: false, filters: false, tools: [], render: function () { renderPeople(); }
    },
    reports: {
      title: function () { return "Reports"; },
      sub: function () { return "Week of 24 – 28 August 2026 · open work and what closed"; },
      kpis: false, filters: false, tools: [], render: function () { renderReports(); }
    },
    settings: {
      title: function () { return "Settings"; },
      sub: function () { return "Streams, statuses, people and the numbers behind the workload view"; },
      kpis: false, filters: false, tools: [], render: function () { renderSettings(); }
    }
  };

  var TOOLS = {
    week: function () { return '<button class="btn" data-tool="week">This week ▾</button>'; },
    person: function () { return '<button class="btn" data-tool="person">' + esc(person(state.me).name) + "’s work ▾</button>"; },
    task: function () { return '<button class="btn btn-primary" data-tool="task">+ New task</button>'; },
    project: function () { return '<button class="btn btn-primary" data-tool="project">+ New project</button>'; }
  };

  function go(page) {
    if (!PAGES[page]) return;
    state.page = page;
    window.scrollTo(0, 0);
    render();
  }

  function renderFacepile() {
    document.getElementById("facepile").innerHTML = PEOPLE.map(function (p) {
      return '<button class="avatar-btn' + (state.people[p.id] ? " on" : "") + '" data-person="' + p.id +
        '" aria-pressed="' + !!state.people[p.id] + '" aria-label="Filter by ' + esc(p.full) + '">' + avatar(p) + "</button>";
    }).join("");
  }

  function statusCell(t) {
    var s = status(t.s);
    return '<button class="status" style="--sc:' + s.color + '" data-status="' + t.id +
      '" aria-label="Status: ' + s.label + '. Change status">' + s.label + "</button>";
  }

  var PIN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11 12.3 20a5 5 0 0 1-7-7l9.2-9.2a3.3 3.3 0 0 1 4.7 4.7l-9.2 9.2a1.7 1.7 0 0 1-2.4-2.4l8.5-8.5"/></svg>';
  var CARET = '<svg class="caret2" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  var TICK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>';

  function fmtSize(b) {
    if (b == null) return "";
    if (b < 1024) return b + " B";
    if (b < 1048576) return Math.round(b / 1024) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }
  function fileIcon(name) {
    var ext = (String(name).split(".").pop() || "").toLowerCase();
    var color = "var(--ink-muted)";
    if (ext === "pdf") color = "var(--danger)";
    else if (ext === "xlsx" || ext === "xls" || ext === "csv") color = "var(--success)";
    else if (ext === "doc" || ext === "docx") color = "var(--st-doing)";
    else if (["png", "jpg", "jpeg", "gif", "webp", "heic", "svg"].indexOf(ext) > -1) color = "var(--s-retail)";
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="' + color +
      '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
  }
  function fileChip(f, path) {
    return '<span class="filechip" title="' + esc(f.name) + '">' +
      (f.url ? '<img src="' + f.url + '" alt="">' : fileIcon(f.name)) +
      '<span class="fname">' + esc(f.name) + "</span>" +
      (f.size ? '<span class="fsize tnum">' + fmtSize(f.size) + "</span>" : "") +
      '<button type="button" class="x" data-filedel="' + path + '" aria-label="Remove ' + esc(f.name) + '">×</button></span>';
  }
  function fileRow(files, prefix) {
    if (!files || !files.length) return "";
    return '<div class="filerow">' + files.map(function (f, i) {
      return fileChip(f, prefix + "|" + i);
    }).join("") + "</div>";
  }

  function subPanel(t, compact) {
    var h = '<div class="subpanel' + (compact ? " bare" : "") + '">';
    t.sub.forEach(function (sb) {
      var o = person(sb.o);
      h += '<div class="subrow' + (compact ? " compact" : "") + (sb.done ? " done" : "") + '" data-sub="' + t.id + "|" + sb.id + '">' +
        '<div class="scell">' +
          '<button class="check sm' + (sb.done ? " on" : "") + '" data-subcheck="' + t.id + "|" + sb.id +
            '" aria-label="Mark subtask done" aria-pressed="' + !!sb.done + '">' + (sb.done ? TICK : "") + "</button>" +
          '<div class="sbody"><span class="stitle">' + esc(sb.t) + "</span>" +
          fileRow(sb.files, t.id + "|" + sb.id) + "</div>" +
        "</div>" +
        '<button class="owner-cell sm" data-subowner="' + t.id + "|" + sb.id +
          '" aria-label="Owner: ' + esc(o.full) + '. Reassign">' + avatar(o) +
          '<span class="nm">' + esc(o.name) + "</span></button>" +
        '<div class="subacts">' +
          '<button class="iconbtn-sm" data-subattach="' + t.id + "|" + sb.id +
            '" aria-label="Attach a document to this subtask" title="Attach a document">' + PIN + "</button>" +
          '<button class="iconbtn-sm" data-subdel="' + t.id + "|" + sb.id +
            '" aria-label="Delete subtask" title="Delete subtask">×</button>' +
        "</div>" +
      "</div>";
    });
    h += '<form class="addsub" data-addsub="' + t.id + '">' +
      '<input type="text" placeholder="Add a subtask, then press Enter" aria-label="New subtask">' +
      '<button class="btn" type="submit">Add</button></form>';
    return h + "</div>";
  }

  function taskRow(t) {
    var p = person(t.o), pr = prio(t.p), dm = dueMeta(t);
    var open = !!state.expanded[t.id];
    var doneN = t.sub.filter(function (sb) { return sb.done; }).length;

    var html = '<div class="titem" data-item="' + t.id + '">' +
      '<div class="row' + (t.s === "done" ? " is-done" : "") + '">' +
      '<div class="task">' +
        '<button class="grip" data-grip="' + t.id + '" aria-label="Reorder ' + esc(t.t) +
          '. Drag, or use the arrow keys" title="Drag to reorder">' +
          '<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true">' +
          '<circle cx="4" cy="4" r="1.3"/><circle cx="8" cy="4" r="1.3"/><circle cx="4" cy="8" r="1.3"/>' +
          '<circle cx="8" cy="8" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="8" cy="12" r="1.3"/></svg>' +
        "</button>" +
        '<button class="check' + (t.s === "done" ? " on" : "") + '" data-check="' + t.id +
          '" aria-label="Mark done" aria-pressed="' + (t.s === "done") + '">' + (t.s === "done" ? TICK : "") + "</button>" +
        "<div>" +
          '<button class="task-title" data-open="' + t.id + '"' +
            (t.color ? ' style="color:' + t.color + '"' : "") + ' title="Open details">' + esc(t.t) + "</button>" +
          '<div class="task-meta">' +
            (t.r ? '<span class="chip-repeat"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>' + (t.r === "daily" ? "Daily" : "Weekly") + "</span>" : "") +
            '<button class="metachip' + (t.sub.length ? "" : " ghost") + '" data-toggle="' + t.id +
              '" aria-expanded="' + open + '">' + CARET +
              (t.sub.length ? doneN + " / " + t.sub.length + " subtasks" : "Add subtasks") + "</button>" +
            '<button class="metachip' + (t.files.length ? "" : " ghost") + '" data-attach="' + t.id +
              '" title="Attach a document">' + PIN +
              (t.files.length ? t.files.length + " file" + (t.files.length === 1 ? "" : "s") : "Attach") + "</button>" +
            (t.comments.length ? '<button class="metachip" data-open="' + t.id + '" title="Open the discussion">' +
              '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>' +
              t.comments.length + "</button>" : "") +
            (t.n ? '<span class="task-note">' + esc(t.n) + "</span>" : "") +
          "</div>" +
          fileRow(t.files, t.id + "|") +
        "</div>" +
      "</div>" +
      '<button class="owner-cell" data-owner="' + t.id + '" aria-label="Owner: ' + esc(p.full) + '. Reassign">' +
        avatar(p) + '<span class="nm">' + esc(p.name) + "</span></button>" +
      statusCell(t) +
      '<span class="prio p-' + t.p + '" style="--pc:' + pr.color + '"><i></i>' + pr.label + "</span>" +
      '<span class="due tnum ' + dm.cls + '">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
      '<span class="est tnum">' + t.e + " h</span>" +
      "</div>";

    if (open) html += subPanel(t);
    return html + "</div>";
  }

  function renderBoard() {
    var any = false;
    var html = '<div class="scroller"><div class="board">';

    GROUPS.forEach(function (g) {
      var rows = TASKS.filter(function (t) { return t.g === g.id && visible(t); });
      var all = TASKS.filter(function (t) { return t.g === g.id; });
      if (!rows.length && (state.q || activePeople().length)) return;
      any = any || rows.length > 0;
      var doneN = all.filter(function (t) { return t.s === "done"; }).length;
      var blockN = all.filter(function (t) { return t.s === "block"; }).length;
      var lateN = all.filter(isOverdue).length;

      html += '<section class="group' + (state.collapsed[g.id] ? " collapsed" : "") + '" style="--gc:' + g.color + '" data-group="' + g.id + '">' +
        '<header class="group-head">' +
          '<button class="caret" data-collapse="' + g.id + '" aria-expanded="' + !state.collapsed[g.id] + '" aria-label="Collapse ' + esc(g.name) + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
          "</button>" +
          '<span class="tag"></span><h3>' + esc(g.name) + "</h3>" +
          '<span class="count tnum">' + rows.length + " task" + (rows.length === 1 ? "" : "s") + "</span>" +
          '<div class="mini">' +
            (lateN ? '<span class="dotstat"><i style="background:var(--st-block)"></i>' + lateN + " late</span>" : "") +
            (blockN ? '<span class="dotstat"><i style="background:var(--st-block)"></i>' + blockN + " blocked</span>" : "") +
            '<span class="dotstat"><i style="background:var(--st-done)"></i>' + doneN + " / " + all.length + " done</span>" +
          "</div>" +
        "</header>" +
        '<div class="cols">' +
          '<span class="label">Task</span><span class="label">Owner</span><span class="label">Status</span>' +
          '<span class="label">Priority</span><span class="label">Due</span><span class="label" style="text-align:right">Est.</span>' +
        "</div>" +
        '<div class="rows">' + rows.map(taskRow).join("") + "</div>" +
        '<button class="addrow" data-add="' + g.id + '">+ Add a task to ' + esc(g.name.toLowerCase()) + "</button>" +
      "</section>";
    });

    html += "</div></div>";
    if (!any) html = '<div class="empty">No task matches this filter. Clear the search or the people filter.</div>';
    document.getElementById("view").innerHTML = html;
    if (state.flash) {
      var fl = document.querySelector('[data-item="' + state.flash + '"]');
      state.flash = null;
      if (fl) {
        fl.classList.add("flash");
        fl.scrollIntoView({ block: "center" });
      }
    }
    restoreFocus();
  }

  function restoreFocus() {
    if (!state.focus) return;
    var f = state.focus, node = null;
    if (f.kind === "grip") node = document.querySelector('[data-grip="' + f.id + '"]');
    if (f.kind === "addsub") {
      var scope = state.open ? document.getElementById("drawer") : document;
      var form = scope.querySelector('[data-addsub="' + f.id + '"]') ||
        document.querySelector('[data-addsub="' + f.id + '"]');
      node = form ? form.querySelector("input") : null;
    }
    state.focus = null;
    if (node) node.focus();
  }

  function weekMeta(t) {
    var bits = [];
    if (t.sub && t.sub.length) {
      var d = t.sub.filter(function (sb) { return sb.done; }).length;
      bits.push(d + " / " + t.sub.length + " subtasks");
    }
    if (t.files && t.files.length) bits.push(t.files.length + " file" + (t.files.length === 1 ? "" : "s"));
    return bits.length ? '<div class="wmeta">' + bits.join(" · ") + "</div>" : "";
  }

  function renderWeek() {
    var me = person(state.me);
    var mine = TASKS.filter(function (t) { return t.o === state.me && visible(t); });
    var buckets = [
      { title: "Overdue", when: "needs attention now", alert: true, f: isOverdue },
      { title: "Today", when: "Friday 28 August", f: function (t) { return days(TODAY, t.d) === 0 && t.s !== "done"; } },
      { title: "Next week", when: "31 Aug – 4 Sep", f: function (t) { var d = days(TODAY, t.d); return d > 0 && d <= 7 && t.s !== "done"; } },
      { title: "Later", when: "beyond 4 September", f: function (t) { return days(TODAY, t.d) > 7 && t.s !== "done"; } },
      { title: "Closed this week", when: "", f: function (t) { return t.s === "done"; } }
    ];

    var html = '<div class="week">';
    var shown = 0;

    if (me.lead) {
      var stuck = TASKS.filter(function (t) { return (t.s === "block" || t.s === "wait") && t.o !== state.me; });
      if (stuck.length) {
        html += '<section class="daycard decide"><header><h3>Needs a decision from you</h3>' +
          '<span class="when">blocked or waiting elsewhere on the team</span>' +
          '<span class="tot tnum">' + stuck.length + " item" + (stuck.length === 1 ? "" : "s") + "</span></header>";
        stuck.forEach(function (t) {
          var g = group(t.g), dm = dueMeta(t), o = person(t.o);
          html += '<div class="wrow">' + avatar(o) +
            '<div class="grow"><div class="stream" style="--sc2:' + g.color + '">' + esc(g.name) + "</div>" +
            '<div class="t">' + esc(t.t) + "</div>" + weekMeta(t) +
            (t.n ? '<div class="task-meta"><span class="task-note">' + esc(t.n) + "</span></div>" : "") +
            "</div>" +
            '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
            statusCell(t) + "</div>";
        });
        html += "</section>";
      }
    }

    buckets.forEach(function (b) {
      var rows = mine.filter(b.f);
      if (!rows.length) return;
      shown += rows.length;
      var hours = rows.reduce(function (a, t) { return a + t.e; }, 0);
      html += '<section class="daycard' + (b.alert ? " alert" : "") + '"><header><h3>' + b.title + "</h3>" +
        (b.when ? '<span class="when">' + b.when + "</span>" : "") +
        '<span class="tot tnum">' + rows.length + " task" + (rows.length === 1 ? "" : "s") + " · " + hours + " h</span></header>";
      rows.forEach(function (t) {
        var g = group(t.g), dm = dueMeta(t);
        html += '<div class="wrow">' +
          '<button class="check' + (t.s === "done" ? " on" : "") + '" data-check="' + t.id + '" aria-label="Mark done"></button>' +
          '<div class="grow"><div class="stream" style="--sc2:' + g.color + '">' + esc(g.name) + "</div>" +
          '<div class="t">' + esc(t.t) + "</div>" + weekMeta(t) + "</div>" +
          '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
          statusCell(t) + "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    if (!shown) html += '<div class="empty">Nothing on ' + esc(me.name) + "’s plate with these filters.</div>";
    document.getElementById("view").innerHTML = html;
  }

  function renderProjects() {
    var html = '<div class="scroller"><div class="kanban">';
    STAGES.forEach(function (st) {
      var cards = PROJECTS.filter(function (p) { return p.stage === st.id; });
      html += '<section class="lane" style="--lc:' + st.color + '"><header><h3 style="color:' + st.color + '">' +
        st.id + '</h3><span class="n tnum">' + cards.length + "</span></header>";
      cards.forEach(function (p) {
        var h = HEALTH[p.health], o = person(p.o), late = days(TODAY, p.msd) < 0;
        html += '<article class="pcard" style="--hc:' + h.color + '">' +
          '<span class="health"><i></i>' + h.label + "</span>" +
          "<h4>" + esc(p.name) + "</h4>" +
          '<div class="ms">Next: <b>' + esc(p.ms) + '</b><br><span class="tnum" style="color:' +
            (late ? "var(--danger)" : "var(--ink-muted)") + '">' + fmtDate(p.msd) + (late ? " · late" : "") + "</span></div>" +
          '<div class="bar"><span style="width:' + Math.round((p.done / p.total) * 100) + '%"></span></div>' +
          "<footer>" + avatar(o) + '<span style="font-size:12px">' + esc(o.name) + "</span>" +
          '<span class="tasks tnum">' + p.done + "/" + p.total + " tasks</span></footer></article>";
      });
      if (!cards.length) html += '<div class="empty" style="padding:22px 8px;font-size:12px">Empty</div>';
      html += "</section>";
    });
    html += "</div></div>";
    document.getElementById("view").innerHTML = html;
  }

  function renderPeople() {
    var CAP = state.capacity;
    var rows = PEOPLE.map(function (p) {
      var mine = TASKS.filter(function (t) { return t.o === p.id && t.s !== "done"; });
      var byStatus = {};
      STATUS.forEach(function (s) {
        byStatus[s.id] = mine.filter(function (t) { return t.s === s.id; }).reduce(function (a, t) { return a + t.e; }, 0);
      });
      return {
        p: p,
        hours: mine.reduce(function (a, t) { return a + t.e; }, 0),
        late: mine.filter(isOverdue).length,
        n: mine.length,
        byStatus: byStatus
      };
    }).sort(function (a, b) { return b.hours - a.hours; });

    var max = Math.max(CAP * 1.35, rows[0].hours * 1.1);

    var html = '<div class="loadwrap"><header>' +
      '<h3 style="font-size:14px;font-weight:600">Open workload this week</h3>' +
      '<span style="font-size:12px;color:var(--ink-muted)">Capacity line at ' + CAP + ' h · estimates from the task cards</span>' +
      '<div class="legend">' + STATUS.filter(function (s) { return s.id !== "done"; }).map(function (s) {
        return '<span><i style="background:' + s.color + '"></i>' + s.label + "</span>";
      }).join("") + "</div></header>";

    rows.forEach(function (r) {
      var flag = r.hours > CAP ? { cls: "over", txt: "Over capacity" }
        : r.late ? { cls: "over", txt: r.late + " overdue" }
        : r.hours < CAP * 0.5 ? { cls: "light", txt: "Room to take more" }
        : { cls: "ok", txt: "Balanced" };
      html += '<div class="lrow"><div class="who2">' + avatar(r.p, "lg") +
        "<div><b>" + esc(r.p.full) + "</b><span>" + esc(r.p.role) + "</span></div></div>" +
        '<div class="stack">' +
          STATUS.filter(function (s) { return s.id !== "done"; }).map(function (s) {
            var w = (r.byStatus[s.id] / max) * 100;
            return w > 0 ? '<i style="width:' + w + '%;background:' + s.color + '" title="' + s.label + ": " + r.byStatus[s.id] + ' h"></i>' : "";
          }).join("") +
          '<span class="cap" style="left:' + ((CAP / max) * 100) + '%"></span>' +
        "</div>" +
        '<div class="hours tnum">' + r.hours + " h <small>/ " + r.n + " open</small></div>" +
        '<div class="flag ' + flag.cls + '">' + flag.txt + "</div>" +
        '<div style="text-align:right"><button class="btn" style="padding:4px 10px;font-size:12px" data-week="' +
          r.p.id + '">Open week</button></div></div>';
    });
    html += "</div>";
    document.getElementById("view").innerHTML = html;
  }

  // ---------- shared row pieces ----------
  function statusPill(t) {
    var st = status(t.s);
    return '<span class="pill" style="--sc:' + st.color + '">' + st.label + "</span>";
  }
  function miniRow(t, o) {
    o = o || {};
    var g = group(t.g), dm = dueMeta(t);
    return '<button class="minirow" data-goto="' + t.id + '" title="' + esc(t.t) + ' — open on the board">' +
      avatar(person(t.o)) +
      '<span class="mt">' + esc(t.t) + "</span>" +
      (t.n && o.stream ? '<span class="note">' + esc(t.n) + "</span>" : "") +
      (o.stream ? '<span class="ms" style="--sc2:' + g.color + '">' + esc(g.name) + "</span>" : "") +
      (o.due ? '<span class="due tnum ' + dm.cls + '" style="width:104px;text-align:right">' +
        fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" : "") +
      statusPill(t) + "</button>";
  }
  function card(title, count, body) {
    return '<section class="card"><header><h3>' + title + "</h3>" +
      (count === null ? "" : '<span class="n tnum">' + count + "</span>") + "</header>" +
      '<div class="cbody">' + body + "</div></section>";
  }
  function addDays(iso, n) {
    return new Date(Date.parse(iso + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10);
  }

  // ---------- Home ----------
  function renderHome() {
    var now = TASKS.filter(function (t) { return t.s !== "done" && days(TODAY, t.d) <= 0; })
      .sort(function (a, b) { return Date.parse(a.d) - Date.parse(b.d); });
    var stuck = TASKS.filter(function (t) { return t.s === "block" || t.s === "wait"; });
    var mine = TASKS.filter(function (t) { return t.o === state.me && t.s !== "done"; })
      .sort(function (a, b) { return Date.parse(a.d) - Date.parse(b.d); }).slice(0, 5);
    var risk = PROJECTS.filter(function (pr) { return pr.health !== "on"; });

    var streams = GROUPS.map(function (g) {
      var all = TASKS.filter(function (t) { return t.g === g.id; });
      var done = all.filter(function (t) { return t.s === "done"; }).length;
      var pct = all.length ? Math.round((done / all.length) * 100) : 0;
      return '<div class="progline" style="--sc:' + g.color + '">' +
        '<span><i class="dot"></i>' + esc(g.name) + "</span>" +
        '<span class="track"><i style="width:' + pct + '%"></i></span>' +
        '<span class="num tnum">' + done + " / " + all.length + "</span></div>";
    }).join("");

    var html = '<div class="homegrid"><div class="colstack">' +
      card("Due today and late", now.length,
        now.length ? now.map(function (t) { return miniRow(t, { due: true, stream: true }); }).join("")
          : '<p class="cempty">Nothing due today. Rare, and worth enjoying.</p>') +
      card("Needs a decision from you", stuck.length,
        stuck.length ? stuck.map(function (t) { return miniRow(t, { due: true, stream: true }); }).join("")
          : '<p class="cempty">Nothing is blocked or waiting.</p>') +
      "</div><div class=\"colstack\">" +
      card("Your next tasks", mine.length,
        (mine.length ? mine.map(function (t) { return miniRow(t, { due: false, stream: false }); }).join("")
          : '<p class="cempty">Your list is clear.</p>')) +
      card("Progress by stream", null, streams) +
      card("Projects needing attention", risk.length,
        risk.length ? risk.map(function (pr) {
          var h = HEALTH[pr.health], o = person(pr.o);
          return '<button class="minirow" data-page="projects">' + avatar(o) +
            '<span class="mt">' + esc(pr.name) + "</span>" +
            '<span class="pill" style="--sc:' + h.color + '">' + h.label + "</span></button>";
        }).join("") : '<p class="cempty">Every project is on track.</p>') +
      "</div></div>";

    document.getElementById("view").innerHTML = html;
  }

  // ---------- Calendar ----------
  function renderCalendar() {
    var start = "2026-08-24";
    var dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var html = '<div class="scroller"><div class="calgrid">' +
      dows.map(function (d) { return '<div class="calhead">' + d + "</div>"; }).join("");

    for (var i = 0; i < 21; i++) {
      var iso = addDays(start, i);
      var list = TASKS.filter(function (t) { return t.d === iso && visible(t); });
      var isToday = iso === TODAY;
      var dnum = parseInt(iso.slice(8), 10);
      var cls = "calcell" + (i % 7 > 4 ? " weekend" : "") + (isToday ? " today" : "") +
        (days(TODAY, iso) < 0 ? " past" : "");
      var shown = state.calMore[iso] ? list : list.slice(0, 3);
      var tag = isToday ? "Today" : (dnum === 1 || i === 0 ? months[parseInt(iso.slice(5, 7), 10) - 1] : "");

      html += '<div class="' + cls + '">' +
        '<div class="caldate"><b class="tnum">' + dnum + "</b><span>" + tag + "</span></div>" +
        shown.map(function (t) {
          return '<button class="calchip' + (t.s === "done" ? " isdone" : "") + '" style="--sc:' + group(t.g).color +
            '" data-goto="' + t.id + '" title="' + esc(t.t + " — " + person(t.o).full) + '">' +
            '<span class="ct">' + esc(t.t) + "</span>" + avatar(person(t.o)) + "</button>";
        }).join("") +
        (list.length > shown.length
          ? '<button class="calmore" data-calmore="' + iso + '">+ ' + (list.length - shown.length) + " more</button>"
          : "") +
        "</div>";
    }
    document.getElementById("view").innerHTML = html + "</div></div>";
  }

  // ---------- Reports ----------
  var CLOSED_HISTORY = [
    { w: "W30", n: 11 }, { w: "W31", n: 14 }, { w: "W32", n: 9 },
    { w: "W33", n: 16 }, { w: "W34", n: 12 }
  ];

  function renderReports() {
    var open = TASKS.filter(function (t) { return t.s !== "done"; });

    var mix = STATUS.map(function (st) {
      return { st: st, n: TASKS.filter(function (t) { return t.s === st.id; }).length };
    }).filter(function (r) { return r.n > 0; });
    var mixTotal = mix.reduce(function (a, r) { return a + r.n; }, 0) || 1;
    var mixBar = '<div style="padding:16px 15px 6px"><div class="stack" style="height:26px">' +
      mix.map(function (r) {
        return '<i style="width:' + ((r.n / mixTotal) * 100) + '%;background:' + r.st.color + '" title="' +
          r.st.label + ": " + r.n + '"></i>';
      }).join("") + "</div></div>" +
      '<div class="legend" style="margin:0;padding:2px 15px 14px;flex-wrap:wrap">' +
      mix.map(function (r) {
        return '<span><i style="background:' + r.st.color + '"></i>' + r.st.label +
          ' <b class="tnum">' + r.n + "</b></span>";
      }).join("") + "</div>";

    var streamRows = GROUPS.map(function (g) {
      var rows = open.filter(function (t) { return t.g === g.id; });
      return { g: g, h: rows.reduce(function (a, t) { return a + t.e; }, 0), n: rows.length };
    }).sort(function (a, b) { return b.h - a.h; });
    var maxH = Math.max.apply(null, streamRows.map(function (r) { return r.h; })) || 1;
    var streamBars = streamRows.map(function (r) {
      return '<div class="hbar" style="--sc:' + r.g.color + '"><span>' + esc(r.g.name) + "</span>" +
        '<span class="track"><i style="width:' + ((r.h / maxH) * 100) + '%"></i></span>' +
        '<span class="num tnum">' + r.h + " h</span></div>";
    }).join("");

    var peopleRows = PEOPLE.map(function (pp) {
      var rows = open.filter(function (t) { return t.o === pp.id; });
      return { p: pp, h: rows.reduce(function (a, t) { return a + t.e; }, 0), late: rows.filter(isOverdue).length };
    }).sort(function (a, b) { return b.h - a.h; });
    var maxP = Math.max.apply(null, peopleRows.map(function (r) { return r.h; })) || 1;
    var peopleBars = peopleRows.map(function (r) {
      return '<div class="hbar" style="--sc:' + (r.h > state.capacity ? "var(--danger)" : "var(--tide)") + '">' +
        '<span>' + esc(r.p.full) + (r.late ? ' <span class="note" style="color:var(--danger)">· ' + r.late + " late</span>" : "") + "</span>" +
        '<span class="track"><i style="width:' + ((r.h / maxP) * 100) + '%"></i></span>' +
        '<span class="num tnum">' + r.h + " h</span></div>";
    }).join("");

    var hist = CLOSED_HISTORY.concat([{ w: "This week", n: TASKS.filter(function (t) { return t.s === "done"; }).length, now: true }]);
    var maxN = Math.max.apply(null, hist.map(function (h) { return h.n; })) || 1;
    var bars = '<div class="vbars">' + hist.map(function (h) {
      return '<div class="vbarcol' + (h.now ? " now" : "") + '"><b class="tnum">' + h.n + "</b>" +
        '<i style="height:' + Math.max(4, (h.n / maxN) * 100) + '%"></i><span>' + h.w + "</span></div>";
    }).join("") + "</div>";

    document.getElementById("view").innerHTML = '<div class="repgrid">' +
      card("Where the work stands", TASKS.length + " tasks", mixBar) +
      card("Open hours by stream", null, streamBars) +
      card("Open hours by person", "capacity " + state.capacity + " h", peopleBars) +
      card("Tasks closed per week", "last five weeks are sample data", bars) +
      "</div>";
  }

  // ---------- Settings ----------
  function renderSettings() {
    var streams = GROUPS.map(function (g) {
      var n = TASKS.filter(function (t) { return t.g === g.id && t.s !== "done"; }).length;
      return '<div class="setrow"><span class="swatch-lg" style="background:' + g.color + '"></span>' +
        '<input class="setinput" data-gname="' + g.id + '" value="' + esc(g.name) + '" aria-label="Rename stream">' +
        '<span class="v tnum">' + n + " open</span></div>";
    }).join("");

    var statuses = STATUS.map(function (st) {
      var n = TASKS.filter(function (t) { return t.s === st.id; }).length;
      return '<div class="setrow"><span class="swatch-lg" style="background:' + st.color + '"></span>' +
        '<span class="k">' + st.label + '</span><span class="v tnum">' + n + "</span></div>";
    }).join("");

    var people = PEOPLE.map(function (pp) {
      var n = TASKS.filter(function (t) { return t.o === pp.id && t.s !== "done"; }).length;
      return '<div class="setrow">' + avatar(pp) + '<span class="k">' + esc(pp.full) +
        '<br><span class="v">' + esc(pp.role) + "</span></span>" +
        '<span class="v tnum">' + n + " open</span>" +
        '<button class="btn" style="padding:3px 9px;font-size:12px" data-week="' + pp.id + '">Open week</button></div>';
    }).join("");

    var prefs =
      '<div class="setrow"><span class="k">Weekly capacity per person<br><span class="v">Drives the capacity line on People and Reports</span></span>' +
        '<input class="setnum tnum" type="number" min="1" max="60" value="' + state.capacity + '" data-cap aria-label="Weekly capacity in hours"></div>' +
      '<div class="setrow"><span class="k">Show completed tasks<br><span class="v">Otherwise they drop off the board once ticked</span></span>' +
        '<label class="toggle"><input type="checkbox" data-setdone ' + (state.showDone ? "checked" : "") + "> Show done</label></div>" +
      '<div class="setrow"><span class="k">Signed in as<br><span class="v">Whose week “My work” opens on</span></span>' +
        '<select class="setnum" style="width:auto" data-me aria-label="Signed in as">' +
        PEOPLE.map(function (pp) {
          return '<option value="' + pp.id + '"' + (pp.id === state.me ? " selected" : "") + ">" + esc(pp.full) + "</option>";
        }).join("") + "</select></div>";

    document.getElementById("view").innerHTML = '<div class="setgrid">' +
      card("Streams", GROUPS.length, streams) +
      card("Statuses", STATUS.length, statuses) +
      card("People", PEOPLE.length, people) +
      card("Preferences", null, prefs) +
      "</div>";
  }

  function render() {
    var pg = PAGES[state.page] || PAGES.board;
    document.getElementById("pagetitle").textContent = pg.title();
    document.getElementById("pagesub").textContent = pg.sub();
    document.getElementById("headtools").innerHTML = pg.tools.map(function (t) { return TOOLS[t](); }).join("");
    document.getElementById("kpis").style.display = pg.kpis ? "" : "none";
    document.getElementById("toolbar").style.display = pg.filters ? "" : "none";
    if (pg.kpis) renderKpis();
    if (pg.filters) renderFacepile();
    renderRail();
    pg.render();
    document.getElementById("foot").textContent =
      "Prototype — sample content. Every entry in the left rail opens a working page. Click a task title to open it: description and comments take bold, italic, colours, highlight and lists; documents drop onto the task or onto a single subtask. On the board, drag a task by its grip to reorder it or move it to another stream. Nothing is saved and no file is uploaded — changes live in this browser tab only.";
  }

  document.addEventListener("click", function (e) {
    var cmd = closestEl(e.target, "[data-cmd]");
    if (cmd) {
      var cName = cmd.dataset.cmd, cArg = cmd.dataset.arg || null;
      try { document.execCommand("styleWithCSS", false, true); } catch (err) { /* older engines */ }
      if (cName === "foreColor" && !cArg) cArg = themeInk();
      document.execCommand(cName, false, cArg);
      saveEditors();
      return;
    }

    var opener = closestEl(e.target, "[data-open]");
    if (opener) { openDrawer(opener.dataset.open); return; }

    if (closestEl(e.target, "[data-dclose]") || e.target.id === "scrim") { closeDrawer(); return; }

    var prb = closestEl(e.target, "[data-prio]");
    if (prb) {
      var pt = findTask(prb.dataset.prio);
      openMenu(prb, PRIOS.map(function (x) { return { label: x.label, id: x.id, color: x.color }; }),
        function (it) { if (pt) pt.p = it.id; refresh(); });
      return;
    }

    var tc = closestEl(e.target, "[data-tcolor]");
    if (tc) {
      var ct = findTask(state.open);
      if (ct) ct.color = tc.dataset.tcolor;
      refresh();
      return;
    }

    var post = closestEl(e.target, "[data-cpost]");
    if (post) { postComment(post.dataset.cpost); return; }

    var cdel = closestEl(e.target, "[data-cdel]");
    if (cdel) {
      var cq = cdel.dataset.cdel.split("|"), ctask = findTask(cq[0]);
      if (ctask) ctask.comments = ctask.comments.filter(function (x) { return x.id !== cq[1]; });
      refresh();
      return;
    }

    var tool = closestEl(e.target, "[data-tool]");
    if (tool) {
      var kind = tool.dataset.tool;
      if (kind === "task") openDialog(state.page === "board" ? "ops" : "ops");
      else if (kind === "project") openProjectDialog();
      else if (kind === "person") {
        openMenu(tool, PEOPLE.map(function (pp) { return { label: pp.full + " — " + pp.role, id: pp.id, avatar: avatar(pp) }; }),
          function (it) { state.me = it.id; render(); });
      } else if (kind === "week") {
        openMenu(tool, [
          { label: "This week", id: "w0" }, { label: "Next week", id: "w1" },
          { label: "This month", id: "m0" }, { label: "Everything", id: "all" }
        ], function () {});
      }
      return;
    }

    var nav = closestEl(e.target, "[data-page]");
    if (nav) { e.preventDefault(); go(nav.dataset.page); return; }

    var jump = closestEl(e.target, "[data-goto]");
    if (jump) {
      var jt = findTask(jump.dataset.goto);
      if (jt) {
        GROUPS.forEach(function (g) { state.collapsed[g.id] = false; });
        state.flash = jt.id;
        go("board");
      }
      return;
    }

    var wk = closestEl(e.target, "[data-week]");
    if (wk) { state.me = wk.dataset.week; go("mywork"); return; }

    var more = closestEl(e.target, "[data-calmore]");
    if (more) { state.calMore[more.dataset.calmore] = true; renderCalendar(); return; }

    var face = e.target.closest("[data-person]");
    if (face) { var id = face.dataset.person; state.people[id] = !state.people[id]; render(); return; }

    var col = e.target.closest("[data-collapse]");
    if (col) { var g = col.dataset.collapse; state.collapsed[g] = !state.collapsed[g]; renderBoard(); return; }

    var chk = e.target.closest("[data-check]");
    if (chk) {
      var t = TASKS.filter(function (x) { return x.id === chk.dataset.check; })[0];
      t.s = t.s === "done" ? "doing" : "done";
      refresh();
      return;
    }

    var stBtn = e.target.closest("[data-status]");
    if (stBtn) {
      var task = TASKS.filter(function (x) { return x.id === stBtn.dataset.status; })[0];
      openMenu(stBtn, STATUS.map(function (s) { return { label: s.label, id: s.id, color: s.color }; }),
        function (it) { task.s = it.id; refresh(); });
      return;
    }

    var ownBtn = e.target.closest("[data-owner]");
    if (ownBtn) {
      var tk = TASKS.filter(function (x) { return x.id === ownBtn.dataset.owner; })[0];
      openMenu(ownBtn, PEOPLE.map(function (p) { return { label: p.full, id: p.id, avatar: avatar(p) }; }),
        function (it) { tk.o = it.id; refresh(); });
      return;
    }

    var tog = closestEl(e.target, "[data-toggle]");
    if (tog) { var tid = tog.dataset.toggle; state.expanded[tid] = !state.expanded[tid]; refresh(); return; }

    var att = closestEl(e.target, "[data-attach]");
    if (att) { pickFilesFor(att.dataset.attach, null); return; }

    var satt = closestEl(e.target, "[data-subattach]");
    if (satt) { var q1 = satt.dataset.subattach.split("|"); pickFilesFor(q1[0], q1[1]); return; }

    var sck = closestEl(e.target, "[data-subcheck]");
    if (sck) {
      var q2 = sck.dataset.subcheck.split("|"), sb = findSub(q2[0], q2[1]);
      if (sb) sb.done = !sb.done;
      refresh();
      return;
    }

    var sow = closestEl(e.target, "[data-subowner]");
    if (sow) {
      var q3 = sow.dataset.subowner.split("|"), sb2 = findSub(q3[0], q3[1]);
      openMenu(sow, PEOPLE.map(function (pp) { return { label: pp.full, id: pp.id, avatar: avatar(pp) }; }),
        function (it) { if (sb2) sb2.o = it.id; refresh(); });
      return;
    }

    var sdl = closestEl(e.target, "[data-subdel]");
    if (sdl) {
      var q4 = sdl.dataset.subdel.split("|"), tk2 = findTask(q4[0]);
      if (tk2) tk2.sub = tk2.sub.filter(function (x) { return x.id !== q4[1]; });
      refresh();
      return;
    }

    var fdl = closestEl(e.target, "[data-filedel]");
    if (fdl) {
      var q5 = fdl.dataset.filedel.split("|");
      var host = q5[1] ? findSub(q5[0], q5[1]) : findTask(q5[0]);
      if (host && host.files) host.files.splice(parseInt(q5[2], 10), 1);
      refresh();
      return;
    }

    var add = e.target.closest("[data-add]");
    if (add) { openDialog(add.dataset.add); return; }
  });

  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value;
    PAGES[state.page].render();
  });
  document.getElementById("showdone").addEventListener("change", function (e) { state.showDone = e.target.checked; render(); });

  // a settings field lives inside the page it re-renders, so let the change
  // event finish before the node it fired from is replaced
  function laterRender() { setTimeout(render, 0); }
  function laterRefresh() { setTimeout(refresh, 0); }

  document.addEventListener("change", function (e) {
    var dd = closestEl(e.target, "[data-ddue]");
    if (dd) {
      var t1 = findTask(state.open);
      if (t1 && dd.value) t1.d = dd.value;
      laterRefresh();
      return;
    }
    var de = closestEl(e.target, "[data-dest]");
    if (de) {
      var t2 = findTask(state.open);
      if (t2) t2.e = Math.max(0, parseFloat(de.value) || 0);
      laterRefresh();
      return;
    }
    var gn = closestEl(e.target, "[data-gname]");
    if (gn) {
      var g = group(gn.dataset.gname);
      var v = gn.value.trim();
      if (v) g.name = v; else gn.value = g.name;
      laterRender();
      return;
    }
    var cap = closestEl(e.target, "[data-cap]");
    if (cap) {
      state.capacity = Math.min(60, Math.max(1, parseInt(cap.value, 10) || 20));
      laterRender();
      return;
    }
    var sd = closestEl(e.target, "[data-setdone]");
    if (sd) {
      state.showDone = sd.checked;
      document.getElementById("showdone").checked = sd.checked;
      laterRender();
      return;
    }
    var me = closestEl(e.target, "[data-me]");
    if (me) { state.me = me.value; laterRender(); }
  });
  document.getElementById("ws").addEventListener("click", function (e) {
    openMenu(e.currentTarget, [
      { label: "Bangkok operations", id: "bkk" },
      { label: "Retail counters", id: "retail" },
      { label: "Food service", id: "fs" }
    ], function () {});
  });

  var dlg = document.getElementById("dlg");
  function fillSelect(sel, items, val) {
    sel.innerHTML = items.map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === val ? " selected" : "") + ">" + esc(i.label) + "</option>";
    }).join("");
  }
  function openDialog(groupId) {
    fillSelect(document.getElementById("f-group"), GROUPS.map(function (g) { return { id: g.id, label: g.name }; }), groupId || "ops");
    fillSelect(document.getElementById("f-owner"), PEOPLE.map(function (p) { return { id: p.id, label: p.full + " — " + p.role }; }), state.me);
    fillSelect(document.getElementById("f-status"), STATUS.map(function (s) { return { id: s.id, label: s.label }; }), "todo");
    fillSelect(document.getElementById("f-prio"), PRIOS.map(function (p) { return { id: p.id, label: p.label }; }), "normal");
    dlg.showModal();
    document.getElementById("f-title").focus();
  }
  document.getElementById("dlg-cancel").addEventListener("click", function () { dlg.close(); });
  document.getElementById("dlg-form").addEventListener("submit", function () {
    var title = document.getElementById("f-title").value.trim();
    if (!title) return;
    TASKS.unshift({
      id: "t" + Date.now(),
      g: document.getElementById("f-group").value,
      t: title,
      o: document.getElementById("f-owner").value,
      s: document.getElementById("f-status").value,
      p: document.getElementById("f-prio").value,
      d: document.getElementById("f-due").value || "2026-09-01",
      e: 2,
      r: document.getElementById("f-repeat").value || undefined,
      sub: [],
      files: []
    });
    document.getElementById("f-title").value = "";
    state.collapsed = {};
    go("board");
  });


  // ---------- new project ----------
  var pdlg = document.getElementById("pdlg");
  function openProjectDialog() {
    fillSelect(document.getElementById("p-owner"), PEOPLE.map(function (pp) { return { id: pp.id, label: pp.full + " — " + pp.role }; }), state.me);
    fillSelect(document.getElementById("p-stage"), STAGES.map(function (st) { return { id: st.id, label: st.id }; }), "Intake");
    fillSelect(document.getElementById("p-health"), [
      { id: "on", label: "On track" }, { id: "risk", label: "At risk" }, { id: "block", label: "Blocked" }
    ], "on");
    pdlg.showModal();
    document.getElementById("p-name").focus();
  }
  document.getElementById("pdlg-cancel").addEventListener("click", function () { pdlg.close(); });
  document.getElementById("pdlg-form").addEventListener("submit", function () {
    var name = document.getElementById("p-name").value.trim();
    if (!name) return;
    PROJECTS.unshift({
      name: name,
      stage: document.getElementById("p-stage").value,
      o: document.getElementById("p-owner").value,
      health: document.getElementById("p-health").value,
      ms: document.getElementById("p-ms").value.trim() || "Kick-off",
      msd: document.getElementById("p-msd").value || "2026-09-15",
      done: 0,
      total: Math.max(1, parseInt(document.getElementById("p-total").value, 10) || 6)
    });
    document.getElementById("p-name").value = "";
    document.getElementById("p-ms").value = "";
    go("projects");
  });

  function postComment(taskId) {
    var t = findTask(taskId);
    var box = document.querySelector("[data-comment]");
    if (!t || !box) return;
    var html = clean(box.innerHTML).trim();
    if (!html || html === "<br>") return;
    t.comments.push({ id: "c" + Date.now(), o: state.me, at: "Just now", html: html });
    state.draft[t.id] = "";
    refresh();
  }

  // ---------- rich text ----------
  var TEXT_COLORS = [
    { hex: "", label: "Theme default" },
    { hex: "#17909f", label: "Tide" },
    { hex: "#e0664a", label: "Coral" },
    { hex: "#d1503c", label: "Red" },
    { hex: "#b57d10", label: "Amber" },
    { hex: "#27946f", label: "Green" },
    { hex: "#8d6ce0", label: "Violet" },
    { hex: "#63797f", label: "Grey" }
  ];

  function themeInk() { return getComputedStyle(document.body).color; }

  function clean(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    var nodes = d.querySelectorAll("*");
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      if (/^(script|style|iframe|object|embed|link|meta|form)$/i.test(n.tagName)) { n.parentNode.removeChild(n); continue; }
      for (var j = n.attributes.length - 1; j >= 0; j--) {
        var a = n.attributes[j].name;
        if (a.indexOf("on") === 0) n.removeAttribute(a);
        if (a === "href" && /^\s*javascript:/i.test(n.getAttribute("href") || "")) n.removeAttribute(a);
      }
    }
    return d.innerHTML;
  }

  function rtToolbar() {
    return '<div class="rttoolbar">' +
      '<button type="button" class="rtbtn" data-cmd="bold" title="Bold"><b>B</b></button>' +
      '<button type="button" class="rtbtn" data-cmd="italic" title="Italic"><i>I</i></button>' +
      '<button type="button" class="rtbtn" data-cmd="underline" title="Underline"><u>U</u></button>' +
      '<button type="button" class="rtbtn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>' +
      '<span class="rtsep"></span>' +
      TEXT_COLORS.map(function (c) {
        return '<button type="button" class="rtcolor" data-cmd="foreColor" data-arg="' + c.hex +
          '" title="Text colour — ' + c.label + '" style="background:' + (c.hex || "var(--ink)") + '"></button>';
      }).join("") +
      '<button type="button" class="rtbtn" data-cmd="hiliteColor" data-arg="#ffe08a" title="Highlight" ' +
        'style="font-weight:700"><span style="background:#ffe08a;color:#10262c;border-radius:3px;padding:0 3px">A</span></button>' +
      '<span class="rtsep"></span>' +
      '<button type="button" class="rtbtn" data-cmd="insertUnorderedList" title="Bulleted list">•</button>' +
      '<button type="button" class="rtbtn" data-cmd="insertOrderedList" title="Numbered list">1.</button>' +
      '<button type="button" class="rtbtn" data-cmd="removeFormat" title="Clear formatting">⌫</button>' +
      "</div>";
  }

  function saveEditors() {
    var t = findTask(state.open);
    if (!t) return;
    var d = document.querySelector("[data-desc]");
    if (d) t.desc = clean(d.innerHTML);
    var c = document.querySelector("[data-comment]");
    if (c) state.draft[t.id] = c.innerHTML;
  }

  // ---------- task drawer ----------
  function openDrawer(id) {
    state.open = id;
    renderDrawer();
  }
  function closeDrawer() {
    saveEditors();
    state.open = null;
    document.getElementById("drawer").hidden = true;
    document.getElementById("scrim").hidden = true;
    render();
  }
  function refresh() {
    render();
    if (state.open) renderDrawer();
  }

  function renderDrawer() {
    var dr = document.getElementById("drawer"), scrim = document.getElementById("scrim");
    var t = findTask(state.open);
    if (!t) { dr.hidden = true; scrim.hidden = true; return; }
    saveEditors();

    var g = group(t.g), p = person(t.o), pr = prio(t.p), dm = dueMeta(t);
    var doneN = t.sub.filter(function (sb) { return sb.done; }).length;

    var meta =
      '<div class="dmeta">' +
        '<span class="k">Owner</span><span><button class="owner-cell" data-owner="' + t.id + '">' +
          avatar(p) + '<span class="nm">' + esc(p.full) + "</span></button></span>" +
        '<span class="k">Status</span><span>' + statusCell(t) + "</span>" +
        '<span class="k">Priority</span><span><button class="btn" data-prio="' + t.id + '">' +
          pr.label + " ▾</button></span>" +
        '<span class="k">Due</span><span><input type="date" data-ddue value="' + t.d + '"> ' +
          '<span class="due tnum ' + dm.cls + '" style="margin-left:8px">' + dm.hint + "</span></span>" +
        '<span class="k">Estimate</span><span><input type="number" step="0.5" min="0" data-dest value="' + t.e + '"> h</span>' +
      "</div>";

    var swatches = '<div class="colorrow"><span class="lbl">Title colour</span>' +
      TEXT_COLORS.map(function (c) {
        return '<button type="button" class="swatchbtn' + (c.hex === t.color ? " on" : "") + (c.hex ? "" : " none") +
          '" data-tcolor="' + c.hex + '" title="' + c.label + '"' +
          (c.hex ? ' style="background:' + c.hex + '"' : "") + "></button>";
      }).join("") + "</div>";

    var comments = t.comments.map(function (c) {
      var o = person(c.o);
      return '<article class="comment"><header>' + avatar(o) + "<b>" + esc(o.full) + "</b><span>" + esc(c.at) + "</span>" +
        '<button class="iconbtn-sm" data-cdel="' + t.id + "|" + c.id + '" aria-label="Delete comment">×</button></header>' +
        '<div class="rtbody">' + c.html + "</div></article>";
    }).join("") || '<p class="cempty" style="padding:6px 0">No comments yet. Start the thread.</p>';

    dr.innerHTML =
      '<header class="dhead"><span class="streamtag" style="--sc:' + g.color + '"><i></i>' + esc(g.name) + "</span>" +
        '<button class="iconbtn-sm" data-dclose aria-label="Close">×</button></header>' +
      '<div class="dbody">' +
        "<div>" +
          '<h2 class="dtitle" contenteditable="true" data-dtitle' +
            (t.color ? ' style="color:' + t.color + '"' : "") + ">" + esc(t.t) + "</h2>" +
          swatches +
        "</div>" +
        meta +
        '<section class="dsec"><h3>Description</h3>' +
          '<div class="rt">' + rtToolbar() +
          '<div class="rtarea" data-desc contenteditable="true" data-ph="What does done look like?">' + t.desc + "</div></div></section>" +
        '<section class="dsec"><h3>Subtasks <span class="n tnum">' + doneN + " / " + t.sub.length + "</span></h3>" +
          subPanel(t, true) + "</section>" +
        '<section class="dsec"><h3>Documents <span class="n tnum">' + t.files.length + "</span></h3>" +
          '<div class="dropbox" data-dropzone="' + t.id + '">Drop documents here' +
            '<br><button class="btn" data-attach="' + t.id + '">Choose files</button></div>' +
          fileRow(t.files, t.id + "|") + "</section>" +
        '<section class="dsec"><h3>Comments <span class="n tnum">' + t.comments.length + "</span></h3>" +
          comments +
          '<div class="composer"><div class="rt">' + rtToolbar() +
            '<div class="rtarea" data-comment contenteditable="true" data-ph="Write a comment…">' +
            (state.draft[t.id] || "") + "</div></div>" +
            '<div class="crow"><span class="hint">Ctrl or ⌘ + Enter to post</span>' +
            '<button class="btn btn-primary" data-cpost="' + t.id + '">Comment</button></div></div>' +
        "</section>" +
      "</div>";

    dr.hidden = false;
    scrim.hidden = false;
  }

  // ---------- lookups, files, drag and drop ----------
  function closestEl(node, sel) {
    var n = node && node.nodeType === 3 ? node.parentNode : node;
    return n && n.closest ? n.closest(sel) : null;
  }
  function findTask(id) {
    for (var i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) return TASKS[i];
    return null;
  }
  function findSub(taskId, subId) {
    var t = findTask(taskId);
    if (!t) return null;
    for (var i = 0; i < t.sub.length; i++) if (t.sub[i].id === subId) return t.sub[i];
    return null;
  }
  function addFiles(host, list) {
    if (!host || !list || !list.length) return;
    if (!host.files) host.files = [];
    for (var i = 0; i < list.length; i++) {
      var f = list[i], rec = { name: f.name, size: f.size };
      if (f.type && f.type.indexOf("image/") === 0 && window.URL && URL.createObjectURL) {
        try { rec.url = URL.createObjectURL(f); } catch (err) { /* preview is optional */ }
      }
      host.files.push(rec);
    }
  }

  var picker = document.createElement("input");
  picker.type = "file";
  picker.multiple = true;
  picker.style.display = "none";
  document.body.appendChild(picker);
  var pickTarget = null;
  function pickFilesFor(taskId, subId) {
    pickTarget = { task: taskId, sub: subId };
    picker.click();
  }
  picker.addEventListener("change", function () {
    if (pickTarget && picker.files && picker.files.length) {
      addFiles(pickTarget.sub ? findSub(pickTarget.task, pickTarget.sub) : findTask(pickTarget.task), picker.files);
      state.expanded[pickTarget.task] = state.expanded[pickTarget.task] || !!pickTarget.sub;
      refresh();
    }
    picker.value = "";
    pickTarget = null;
  });

  // new subtask
  document.addEventListener("submit", function (e) {
    var form = closestEl(e.target, "[data-addsub]");
    if (!form) return;
    e.preventDefault();
    var t = findTask(form.dataset.addsub);
    var input = form.querySelector("input");
    var title = input.value.trim();
    if (!t || !title) return;
    t.sub.push({ id: "s" + Date.now(), t: title, o: t.o, done: false, files: [] });
    state.focus = { kind: "addsub", id: t.id };
    refresh();
  });

  document.addEventListener("input", function (e) {
    var ti = closestEl(e.target, "[data-dtitle]");
    if (ti) {
      var t = findTask(state.open);
      if (t) t.t = ti.textContent.replace(/\s+/g, " ").trim() || t.t;
      return;
    }
    if (closestEl(e.target, "[data-desc]") || closestEl(e.target, "[data-comment]")) saveEditors();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && closestEl(e.target, "[data-comment]")) {
      e.preventDefault();
      if (state.open) postComment(state.open);
      return;
    }
    if (e.key === "Enter" && closestEl(e.target, "[data-dtitle]")) { e.preventDefault(); e.target.blur(); }
  });

  document.addEventListener("focusout", function (e) {
    if (closestEl(e.target, "[data-dtitle]")) laterRefresh();
  });

  // reorder: drag from the grip, or move with the arrow keys while it has focus
  var dragId = null;
  function clearMarks() {
    var marked = document.querySelectorAll(".dropbefore, .dropafter, .filedrop");
    for (var i = 0; i < marked.length; i++) marked[i].classList.remove("dropbefore", "dropafter", "filedrop");
  }
  function clearDraggable() {
    var d = document.querySelectorAll('.titem[draggable="true"]');
    for (var i = 0; i < d.length; i++) d[i].draggable = false;
  }
  function moveTask(id, targetId, after, groupId) {
    var from = -1, i;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) from = i;
    if (from < 0) return;
    var t = TASKS.splice(from, 1)[0];
    if (groupId) t.g = groupId;
    var to = -1;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === targetId) to = i;
    if (to < 0) TASKS.push(t);
    else TASKS.splice(after ? to + 1 : to, 0, t);
  }
  function moveToGroupEnd(id, groupId) {
    var from = -1, i, last = -1;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) from = i;
    if (from < 0) return;
    var t = TASKS.splice(from, 1)[0];
    t.g = groupId;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].g === groupId) last = i;
    TASKS.splice(last + 1, 0, t);
  }
  function nudge(id, dir) {
    var t = findTask(id);
    if (!t) return;
    var idx = [], i;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].g === t.g && visible(TASKS[i])) idx.push(i);
    var pos = idx.indexOf(TASKS.indexOf(t));
    var swap = idx[pos + dir];
    if (swap === undefined) return;
    var a = TASKS.indexOf(t);
    TASKS[a] = TASKS[swap];
    TASKS[swap] = t;
  }

  document.addEventListener("mousedown", function (e) {
    if (closestEl(e.target, "[data-cmd]")) { e.preventDefault(); return; }
    var g = closestEl(e.target, "[data-grip]");
    if (g) { var it = closestEl(g, ".titem"); if (it) it.draggable = true; }
  });
  document.addEventListener("mouseup", clearDraggable);

  document.addEventListener("dragstart", function (e) {
    var it = closestEl(e.target, ".titem");
    if (!it || !it.draggable) return;
    dragId = it.dataset.item;
    it.classList.add("dragging");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* Safari */ }
    }
  });
  document.addEventListener("dragend", function () {
    dragId = null;
    clearMarks();
    clearDraggable();
    var d = document.querySelectorAll(".dragging");
    for (var i = 0; i < d.length; i++) d[i].classList.remove("dragging");
  });

  function hasFiles(dt) {
    if (!dt || !dt.types) return false;
    for (var i = 0; i < dt.types.length; i++) if (dt.types[i] === "Files") return true;
    return false;
  }

  document.addEventListener("dragover", function (e) {
    var item = closestEl(e.target, ".titem");
    var sub = closestEl(e.target, ".subrow");
    var box = closestEl(e.target, "[data-dropzone]");
    if (hasFiles(e.dataTransfer)) {
      e.preventDefault();
      clearMarks();
      var zone = sub || box || item;
      if (zone) { e.dataTransfer.dropEffect = "copy"; zone.classList.add("filedrop"); }
      return;
    }
    if (!dragId) return;
    clearMarks();
    if (item && item.dataset.item !== dragId) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var r = item.getBoundingClientRect();
      item.classList.add(e.clientY > r.top + r.height / 2 ? "dropafter" : "dropbefore");
    } else if (closestEl(e.target, ".group")) {
      e.preventDefault();
    }
  });

  document.addEventListener("drop", function (e) {
    var item = closestEl(e.target, ".titem");
    var sub = closestEl(e.target, ".subrow");
    var grp = closestEl(e.target, ".group");

    if (hasFiles(e.dataTransfer)) {
      e.preventDefault();
      clearMarks();
      var box2 = closestEl(e.target, "[data-dropzone]");
      if (sub) {
        var q = sub.dataset.sub.split("|");
        addFiles(findSub(q[0], q[1]), e.dataTransfer.files);
        refresh();
      } else if (box2) {
        addFiles(findTask(box2.dataset.dropzone), e.dataTransfer.files);
        refresh();
      } else if (item) {
        addFiles(findTask(item.dataset.item), e.dataTransfer.files);
        refresh();
      }
      return;
    }

    if (!dragId) return;
    e.preventDefault();
    if (item && item.dataset.item !== dragId) {
      var r = item.getBoundingClientRect();
      moveTask(dragId, item.dataset.item, e.clientY > r.top + r.height / 2, grp ? grp.dataset.group : null);
    } else if (grp) {
      moveToGroupEnd(dragId, grp.dataset.group);
    }
    dragId = null;
    clearMarks();
    clearDraggable();
    render();
  });

  document.addEventListener("keydown", function (e) {
    var g = closestEl(e.target, "[data-grip]");
    if (!g || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
    e.preventDefault();
    nudge(g.dataset.grip, e.key === "ArrowUp" ? -1 : 1);
    state.focus = { kind: "grip", id: g.dataset.grip };
    renderBoard();
  });

  renderRail();
  render();
})();
</script>
