<title>Thammachart Harbour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
  :root {
    /* Deep sea → ice */
    --sea-900: #07333d;
    --sea-800: #0b4552;
    --tide: #0f7383;
    --tide-600: #0c5f6d;
    --tide-wash: #e2eff0;
    --coral: #e0664a;
    --coral-deep: #c14a30;

    --bg: #eef3f2;
    --surface: #ffffff;
    --surface-2: #f5f8f7;
    --ink: #10262c;
    --ink-2: #3c5158;
    --ink-muted: #63797f;
    --line: #d9e3e2;
    --line-soft: #e8efee;

    --bar-ink: #d3e4e4;
    --bar-ink-dim: rgba(211, 228, 228, 0.6);

    /* Status */
    --st-todo: #6b7b82;
    --st-doing: #2f7fa8;
    --st-wait: #b8791b;
    --st-block: #c2412f;
    --st-done: #177a5e;
    --st-ink: #ffffff;

    /* Streams — categorical, separated for CVD */
    --s-ops: #0f7383;
    --s-retail: #7b57c9;
    --s-food: #b04a8a;
    --s-source: #2f6fb5;
    --s-quality: #2f7d4a;
    --s-intake: #c2681f;

    --danger: #c2412f;
    --warning: #a86e10;
    --success: #177a5e;

    --radius: 10px;
    --shadow: 0 1px 2px rgb(7 51 61 / 0.05), 0 10px 26px -18px rgb(7 51 61 / 0.4);
    --row-cols: minmax(300px, 1fr) 152px 150px 116px 128px 78px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sea-900: #05202a;
      --sea-800: #0a3340;
      --tide: #38a6b8;
      --tide-600: #2b8b9b;
      --tide-wash: rgba(56, 166, 184, 0.14);
      --coral: #f0836a;
      --coral-deep: #e0664a;

      --bg: #06222a;
      --surface: #0d323c;
      --surface-2: #113c48;
      --ink: #e6f0ef;
      --ink-2: #b3c8cb;
      --ink-muted: #8ba3a8;
      --line: rgba(178, 216, 218, 0.16);
      --line-soft: rgba(178, 216, 218, 0.09);

      --bar-ink: #cfe3e3;
      --bar-ink-dim: rgba(207, 227, 227, 0.58);

      --st-todo: #7e8f96;
      --st-doing: #4796bd;
      --st-wait: #cf9226;
      --st-block: #db6150;
      --st-done: #2e9a78;
      --st-ink: #04191f;

      --s-ops: #3ea7b7;
      --s-retail: #a68ae0;
      --s-food: #dd7ab6;
      --s-source: #5f9ce0;
      --s-quality: #4faa73;
      --s-intake: #e0904a;

      --danger: #e2705e;
      --warning: #d3a03a;
      --success: #3ea583;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 30px -20px rgb(0 0 0 / 0.8);
    }
  }

  :root[data-theme="dark"] {
    --sea-900: #05202a;
    --sea-800: #0a3340;
    --tide: #38a6b8;
    --tide-600: #2b8b9b;
    --tide-wash: rgba(56, 166, 184, 0.14);
    --coral: #f0836a;
    --coral-deep: #e0664a;

    --bg: #06222a;
    --surface: #0d323c;
    --surface-2: #113c48;
    --ink: #e6f0ef;
    --ink-2: #b3c8cb;
    --ink-muted: #8ba3a8;
    --line: rgba(178, 216, 218, 0.16);
    --line-soft: rgba(178, 216, 218, 0.09);

    --bar-ink: #cfe3e3;
    --bar-ink-dim: rgba(207, 227, 227, 0.58);

    --st-todo: #7e8f96;
    --st-doing: #4796bd;
    --st-wait: #cf9226;
    --st-block: #db6150;
    --st-done: #2e9a78;
    --st-ink: #04191f;

    --s-ops: #3ea7b7;
    --s-retail: #a68ae0;
    --s-food: #dd7ab6;
    --s-source: #5f9ce0;
    --s-quality: #4faa73;
    --s-intake: #e0904a;

    --danger: #e2705e;
    --warning: #d3a03a;
    --success: #3ea583;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 30px -20px rgb(0 0 0 / 0.8);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }

  :where(a, button, input, select, [tabindex]):focus-visible {
    outline: 2px solid var(--coral);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .tnum { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 16px;
    height: 54px; padding: 0 18px;
    background: var(--sea-900);
    color: var(--bar-ink);
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg, var(--tide), var(--coral) 65%, var(--sea-800)) 1;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand .mark {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: #fff;
  }
  .brand .mark em { color: var(--coral); font-style: normal; }
  .brand .org { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bar-ink-dim); white-space: nowrap; }
  .topbar .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.1);
    border-radius: 99px; padding: 4px 11px; font-size: 12px; color: var(--bar-ink); cursor: pointer;
  }
  .topbar .chip:hover { background: rgb(255 255 255 / 0.14); }
  .topbar .spacer { flex: 1; }
  .topbar .iconbtn {
    border: 0; background: rgb(255 255 255 / 0.07); color: var(--bar-ink);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .topbar .iconbtn:hover { background: rgb(255 255 255 / 0.15); }
  .topbar .me { display: flex; align-items: center; gap: 9px; }
  .topbar .me span.n { font-size: 12.5px; color: var(--bar-ink); }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }

  .rail {
    position: sticky; top: 54px;
    height: calc(100dvh - 54px);
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .rail .sect { padding: 14px 10px 6px; }
  .rail a {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; border-radius: 8px;
    font-size: 13.5px; color: var(--ink-2); text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .rail a:hover { background: var(--surface-2); color: var(--ink); }
  .rail a[aria-current="page"] { background: var(--tide-wash); color: var(--tide-600); font-weight: 600; }
  .rail a .ico { width: 17px; height: 17px; flex: none; opacity: 0.75; }
  .rail a[aria-current="page"] .ico { opacity: 1; color: var(--tide); }
  .rail a .badge {
    margin-left: auto; font-size: 11px; font-weight: 600;
    background: var(--coral); color: #fff; border-radius: 99px; padding: 0 6px;
  }
  .rail .streams { display: flex; flex-direction: column; gap: 1px; }
  .rail .streams button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 0; background: none; cursor: pointer; text-align: left;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2);
  }
  .rail .streams button:hover { background: var(--surface-2); color: var(--ink); }
  .rail .streams i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .rail .streams .c { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }

  main { min-width: 0; padding: 26px 30px 60px; }

  /* ---------- Page head ---------- */
  .pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; justify-content: space-between; }
  .pagehead h1 {
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-size: 34px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05;
    text-wrap: balance;
  }
  .pagehead .sub { margin-top: 5px; color: var(--ink-muted); font-size: 13px; }
  .headtools { display: flex; align-items: center; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-muted); }
  .btn-primary { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--coral-deep); border-color: var(--coral-deep); }

  /* ---------- KPI strip ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--kpi-color, var(--line)); }
  .kpi .v { font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .kpi .k { margin-top: 1px; }
  .kpi .hint { margin-top: 5px; font-size: 11.5px; color: var(--ink-muted); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin-top: 24px; padding-bottom: 11px; border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 3px; }
  .tab {
    border: 0; background: none; padding: 7px 12px 10px; cursor: pointer;
    color: var(--ink-muted); font-size: 13.5px; font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -12px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--coral); }
  .tab .n { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--ink-muted); font-weight: 600; border: 1px solid var(--line-soft); }
  .tab[aria-selected="true"] .n { background: var(--tide-wash); color: var(--tide-600); border-color: transparent; }

  .spacer { flex: 1; }

  .search { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .search input { border: 0; background: none; outline: none; color: inherit; font-size: 13px; width: 168px; }
  .search input::placeholder { color: var(--ink-muted); }

  .facepile { display: flex; align-items: center; gap: 5px; }
  .facepile .avatar-btn {
    border: 0; padding: 0; background: none; cursor: pointer; border-radius: 99px; line-height: 0;
    opacity: 0.4; transition: opacity 0.15s ease;
  }
  .facepile .avatar-btn:hover { opacity: 0.8; }
  .facepile .avatar-btn.on { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--coral); }

  .toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--tide); width: 15px; height: 15px; }

  /* ---------- Avatars ---------- */
  .avatar {
    width: 26px; height: 26px; border-radius: 99px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; color: #fff; flex: none;
  }
  .avatar.lg { width: 34px; height: 34px; font-size: 12px; }
  .avatar.lead { box-shadow: inset 0 0 0 1.5px var(--coral); }

  /* ---------- Board ---------- */
  .scroller { overflow-x: auto; margin-top: 18px; padding-bottom: 4px; }
  .board { min-width: 900px; display: flex; flex-direction: column; gap: 18px; }

  .group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 15px; }
  .group-head .caret { border: 0; background: none; cursor: pointer; color: var(--ink-muted); padding: 2px; line-height: 0; transition: transform 0.18s ease; }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head .tag { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); flex: none; }
  .group-head h3 { font-size: 14.5px; font-weight: 600; color: var(--gc); }
  .group-head .count { font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini .dotstat { display: inline-flex; align-items: center; gap: 5px; }
  .group-head .mini i { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }

  .cols, .row { display: grid; grid-template-columns: var(--row-cols); align-items: center; column-gap: 12px; }
  .cols { padding: 7px 15px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }
  .group.collapsed .cols, .group.collapsed .rows { display: none; }

  .row { padding: 9px 15px; border-top: 1px solid var(--line-soft); transition: background-color 0.12s ease; }
  .row:hover { background: var(--surface-2); }
  .row.is-done .task-title { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .task { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .check {
    width: 17px; height: 17px; margin-top: 2px; flex: none;
    border-radius: 5px; border: 1.5px solid var(--line); background: var(--surface);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .check:hover { border-color: var(--st-done); }
  .check.on { background: var(--st-done); border-color: var(--st-done); color: #fff; }
  .task-title { font-size: 13.5px; line-height: 1.35; }
  .task-meta { margin-top: 3px; min-height: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-muted); }
  .chip-repeat { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px 0 5px; height: 17px; color: var(--ink-2); }
  .task-note { color: var(--danger); }

  .owner-cell { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 3px 5px; border-radius: 8px; cursor: pointer; min-width: 0; text-align: left; }
  .owner-cell:hover { background: var(--line-soft); }
  .owner-cell .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status {
    border: 0; cursor: pointer; width: 100%; height: 29px; border-radius: 6px;
    color: var(--st-ink); background: var(--sc);
    font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    transition: filter 0.15s ease;
  }
  .status:hover { filter: brightness(1.08); }

  .prio { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .prio i { width: 3px; height: 13px; border-radius: 2px; background: var(--pc); display: inline-block; }
  .prio.p-critical { color: var(--danger); font-weight: 600; }
  .prio.p-high { font-weight: 600; }
  .prio.p-low { color: var(--ink-muted); }

  .due { font-size: 12.5px; }
  .due small { display: block; font-size: 10.5px; color: var(--ink-muted); }
  .due.overdue { color: var(--danger); font-weight: 600; }
  .due.overdue small { color: var(--danger); opacity: 0.85; }
  .due.today { color: var(--tide-600); font-weight: 600; }

  .est { font-size: 12.5px; color: var(--ink-muted); text-align: right; }

  .addrow {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 15px 11px 34px; border-top: 1px solid var(--line-soft);
    color: var(--ink-muted); font-size: 12.5px;
    border-width: 0; background: none; cursor: pointer; width: 100%;
  }
  .addrow:hover { color: var(--ink); background: var(--surface-2); }
  .group.collapsed .addrow { display: none; }

  .empty { padding: 40px 16px; text-align: center; color: var(--ink-muted); font-size: 13px; }

  /* ---------- Reorder, subtasks, attachments ---------- */
  .titem { position: relative; }
  .titem.dragging { opacity: 0.4; }
  .titem.filedrop { outline: 2px dashed var(--coral); outline-offset: -2px; background: var(--tide-wash); }
  .titem.dropbefore::before, .titem.dropafter::after {
    content: ""; position: absolute; left: 10px; right: 10px; height: 2px;
    background: var(--coral); border-radius: 2px; z-index: 2;
  }
  .titem.dropbefore::before { top: -1px; }
  .titem.dropafter::after { bottom: -1px; }

  .grip {
    border: 0; background: none; padding: 0 1px; margin-top: 3px; flex: none; line-height: 0;
    color: var(--ink-muted); cursor: grab; opacity: 0; transition: opacity 0.12s ease;
  }
  .row:hover .grip, .grip:focus-visible { opacity: 1; }
  .grip:active { cursor: grabbing; }

  .metachip {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--line); border-radius: 99px; padding: 0 8px 0 6px; height: 18px;
    background: none; color: var(--ink-2); font-size: 11px; cursor: pointer;
  }
  .metachip:hover { background: var(--tide-wash); border-color: var(--tide); color: var(--tide-600); }
  .metachip.ghost { display: none; }
  .row:hover .metachip.ghost, .row:focus-within .metachip.ghost { display: inline-flex; }
  @media (hover: none) { .metachip.ghost { display: inline-flex; } }
  .metachip .caret2 { transition: transform 0.15s ease; }
  .metachip[aria-expanded="true"] .caret2 { transform: rotate(90deg); }

  .filerow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .filechip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
    padding: 2px 5px 2px 6px; font-size: 11px; color: var(--ink-2); max-width: 262px;
  }
  .filechip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filechip .fsize { color: var(--ink-muted); font-size: 10px; }
  .filechip img { width: 18px; height: 18px; object-fit: cover; border-radius: 3px; flex: none; }
  .filechip .x { border: 0; background: none; color: var(--ink-muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 1px; }
  .filechip .x:hover { color: var(--danger); }

  .subpanel { border-top: 1px solid var(--line-soft); background: var(--surface-2); padding: 6px 15px 10px; }
  .subrow { display: grid; grid-template-columns: var(--row-cols); align-items: center; column-gap: 12px; padding: 5px 0; }
  .subrow:hover { background: var(--surface); }
  .subrow.filedrop { outline: 2px dashed var(--coral); outline-offset: -2px; background: var(--tide-wash); }
  .subrow.done .stitle { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .scell { display: flex; align-items: flex-start; gap: 10px; padding-left: 34px; min-width: 0; }
  .sbody { min-width: 0; }
  .stitle { font-size: 13px; line-height: 1.35; }
  .check.sm { width: 15px; height: 15px; margin-top: 1px; border-radius: 4px; }
  .owner-cell.sm { padding: 2px 5px 2px 3px; }
  .subacts { display: flex; gap: 2px; }
  .iconbtn-sm {
    border: 0; background: none; color: var(--ink-muted); cursor: pointer; flex: none;
    width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn-sm:hover { background: var(--line-soft); color: var(--ink); }
  .addsub { display: flex; gap: 8px; padding: 8px 0 0 34px; max-width: 640px; }
  .addsub input {
    flex: 1; border: 1px dashed var(--line); background: none; border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 12.5px; color: inherit;
  }
  .addsub input::placeholder { color: var(--ink-muted); }
  .addsub input:focus { outline: none; border-color: var(--tide); border-style: solid; }

  .wmeta { display: flex; gap: 10px; margin-top: 2px; font-size: 11px; color: var(--ink-muted); }

            (t.n ? '<div class="task-meta"><span class="task-note">' + esc(t.n) + "</span></div>" : "") +
            "</div>" +
            '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
            statusCell(t) + "</div>";
        });
        html += "</section>";
      }
    }

    buckets.forEach(function (b) {
      var rows = mine.filter(b.f);
      if (!rows.length) return;
      shown += rows.length;
      var hours = rows.reduce(function (a, t) { return a + t.e; }, 0);
      html += '<section class="daycard' + (b.alert ? " alert" : "") + '"><header><h3>' + b.title + "</h3>" +
        (b.when ? '<span class="when">' + b.when + "</span>" : "") +
        '<span class="tot tnum">' + rows.length + " task" + (rows.length === 1 ? "" : "s") + " · " + hours + " h</span></header>";
      rows.forEach(function (t) {
        var g = group(t.g), dm = dueMeta(t);
        html += '<div class="wrow">' +
          '<button class="check' + (t.s === "done" ? " on" : "") + '" data-check="' + t.id + '" aria-label="Mark done"></button>' +
          '<div class="grow"><div class="stream" style="--sc2:' + g.color + '">' + esc(g.name) + "</div>" +
          '<div class="t">' + esc(t.t) + "</div>" + weekMeta(t) + "</div>" +
          '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
          statusCell(t) + "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    if (!shown) html += '<div class="empty">Nothing on ' + esc(me.name) + "’s plate with these filters.</div>";
    document.getElementById("view").innerHTML = html;

    var btn = document.getElementById("switch-person");
    btn.addEventListener("click", function () {
      openMenu(btn, PEOPLE.map(function (p) { return { label: p.full + " — " + p.role, id: p.id, avatar: avatar(p) }; }),
        function (it) { state.me = it.id; renderTabs(); renderWeek(); });
    });
  }

  function renderProjects() {
    var html = '<div class="scroller"><div class="kanban">';
    STAGES.forEach(function (st) {
      var cards = PROJECTS.filter(function (p) { return p.stage === st.id; });
      html += '<section class="lane" style="--lc:' + st.color + '"><header><h3 style="color:' + st.color + '">' +
        st.id + '</h3><span class="n tnum">' + cards.length + "</span></header>";
      cards.forEach(function (p) {
        var h = HEALTH[p.health], o = person(p.o), late = days(TODAY, p.msd) < 0;
        html += '<article class="pcard" style="--hc:' + h.color + '">' +
          '<span class="health"><i></i>' + h.label + "</span>" +
          "<h4>" + esc(p.name) + "</h4>" +
          '<div class="ms">Next: <b>' + esc(p.ms) + '</b><br><span class="tnum" style="color:' +
            (late ? "var(--danger)" : "var(--ink-muted)") + '">' + fmtDate(p.msd) + (late ? " · late" : "") + "</span></div>" +
          '<div class="bar"><span style="width:' + Math.round((p.done / p.total) * 100) + '%"></span></div>' +
          "<footer>" + avatar(o) + '<span style="font-size:12px">' + esc(o.name) + "</span>" +
          '<span class="tasks tnum">' + p.done + "/" + p.total + " tasks</span></footer></article>";
      });
      if (!cards.length) html += '<div class="empty" style="padding:22px 8px;font-size:12px">Empty</div>';
      html += "</section>";
    });
    html += "</div></div>";
    document.getElementById("view").innerHTML = html;
  }

  function renderLoad() {
    var CAP = 20;
    var rows = PEOPLE.map(function (p) {
      var mine = TASKS.filter(function (t) { return t.o === p.id && t.s !== "done"; });
      var byStatus = {};
      STATUS.forEach(function (s) {
        byStatus[s.id] = mine.filter(function (t) { return t.s === s.id; }).reduce(function (a, t) { return a + t.e; }, 0);
      });
      return {
        p: p,
        hours: mine.reduce(function (a, t) { return a + t.e; }, 0),
        late: mine.filter(isOverdue).length,
        n: mine.length,
        byStatus: byStatus
      };
    }).sort(function (a, b) { return b.hours - a.hours; });

    var max = Math.max(CAP * 1.35, rows[0].hours * 1.1);

    var html = '<div class="loadwrap"><header>' +
      '<h3 style="font-size:14px;font-weight:600">Open workload this week</h3>' +
      '<span style="font-size:12px;color:var(--ink-muted)">Capacity line at ' + CAP + ' h · estimates from the task cards</span>' +
      '<div class="legend">' + STATUS.filter(function (s) { return s.id !== "done"; }).map(function (s) {
        return '<span><i style="background:' + s.color + '"></i>' + s.label + "</span>";
      }).join("") + "</div></header>";

    rows.forEach(function (r) {
      var flag = r.hours > CAP ? { cls: "over", txt: "Over capacity" }
        : r.late ? { cls: "over", txt: r.late + " overdue" }
        : r.hours < CAP * 0.5 ? { cls: "light", txt: "Room to take more" }
        : { cls: "ok", txt: "Balanced" };
      html += '<div class="lrow"><div class="who2">' + avatar(r.p, "lg") +
        "<div><b>" + esc(r.p.full) + "</b><span>" + esc(r.p.role) + "</span></div></div>" +
        '<div class="stack">' +
          STATUS.filter(function (s) { return s.id !== "done"; }).map(function (s) {
            var w = (r.byStatus[s.id] / max) * 100;
            return w > 0 ? '<i style="width:' + w + '%;background:' + s.color + '" title="' + s.label + ": " + r.byStatus[s.id] + ' h"></i>' : "";
          }).join("") +
          '<span class="cap" style="left:' + ((CAP / max) * 100) + '%"></span>' +
        "</div>" +
        '<div class="hours tnum">' + r.hours + " h <small>/ " + r.n + " open</small></div>" +
        '<div class="flag ' + flag.cls + '">' + flag.txt + "</div></div>";
    });
    html += "</div>";
    document.getElementById("view").innerHTML = html;
  }

  function render() {
    renderKpis();
    renderTabs();
    renderFacepile();
    if (state.view === "board") renderBoard();
    else if (state.view === "week") renderWeek();
    else if (state.view === "projects") renderProjects();
    else renderLoad();
    document.querySelector(".search").style.display = (state.view === "projects" || state.view === "load") ? "none" : "";
    document.getElementById("foot").textContent =
      "Prototype — sample content. On the board you can drag a task by its grip to reorder it or move it to another stream (arrow keys work too), open a task to add subtasks, and drop documents straight onto a task or a subtask. People, streams, tasks and estimates are placeholders. Nothing is saved and no file is uploaded — dropped documents live in this browser tab only.";
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest(".tab");
    if (tab) { state.view = tab.dataset.view; render(); return; }

    var face = e.target.closest("[data-person]");
    if (face) { var id = face.dataset.person; state.people[id] = !state.people[id]; render(); return; }

    var col = e.target.closest("[data-collapse]");
    if (col) { var g = col.dataset.collapse; state.collapsed[g] = !state.collapsed[g]; renderBoard(); return; }

    var chk = e.target.closest("[data-check]");
    if (chk) {
      var t = TASKS.filter(function (x) { return x.id === chk.dataset.check; })[0];
      t.s = t.s === "done" ? "doing" : "done";
      render();
      return;
    }

    var stBtn = e.target.closest("[data-status]");
    if (stBtn) {
      var task = TASKS.filter(function (x) { return x.id === stBtn.dataset.status; })[0];
      openMenu(stBtn, STATUS.map(function (s) { return { label: s.label, id: s.id, color: s.color }; }),
        function (it) { task.s = it.id; render(); });
      return;
    }

    var ownBtn = e.target.closest("[data-owner]");
    if (ownBtn) {
      var tk = TASKS.filter(function (x) { return x.id === ownBtn.dataset.owner; })[0];
      openMenu(ownBtn, PEOPLE.map(function (p) { return { label: p.full, id: p.id, avatar: avatar(p) }; }),
        function (it) { tk.o = it.id; render(); });
      return;
    }

    var tog = closestEl(e.target, "[data-toggle]");
    if (tog) { var tid = tog.dataset.toggle; state.expanded[tid] = !state.expanded[tid]; renderBoard(); return; }

    var att = closestEl(e.target, "[data-attach]");
    if (att) { pickFilesFor(att.dataset.attach, null); return; }

    var satt = closestEl(e.target, "[data-subattach]");
    if (satt) { var q1 = satt.dataset.subattach.split("|"); pickFilesFor(q1[0], q1[1]); return; }

    var sck = closestEl(e.target, "[data-subcheck]");
    if (sck) {
      var q2 = sck.dataset.subcheck.split("|"), sb = findSub(q2[0], q2[1]);
      if (sb) sb.done = !sb.done;
      renderBoard();
      return;
    }

    var sow = closestEl(e.target, "[data-subowner]");
    if (sow) {
      var q3 = sow.dataset.subowner.split("|"), sb2 = findSub(q3[0], q3[1]);
      openMenu(sow, PEOPLE.map(function (pp) { return { label: pp.full, id: pp.id, avatar: avatar(pp) }; }),
        function (it) { if (sb2) sb2.o = it.id; renderBoard(); });
      return;
    }

    var sdl = closestEl(e.target, "[data-subdel]");
    if (sdl) {
      var q4 = sdl.dataset.subdel.split("|"), tk2 = findTask(q4[0]);
      if (tk2) tk2.sub = tk2.sub.filter(function (x) { return x.id !== q4[1]; });
      renderBoard();
      return;
    }

    var fdl = closestEl(e.target, "[data-filedel]");
    if (fdl) {
      var q5 = fdl.dataset.filedel.split("|");
      var host = q5[1] ? findSub(q5[0], q5[1]) : findTask(q5[0]);
      if (host && host.files) host.files.splice(parseInt(q5[2], 10), 1);
      renderBoard();
      return;
    }

    var add = e.target.closest("[data-add]");
    if (add) { openDialog(add.dataset.add); return; }
  });

  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value;
    if (state.view === "board") renderBoard(); else if (state.view === "week") renderWeek();
  });
  document.getElementById("showdone").addEventListener("change", function (e) { state.showDone = e.target.checked; render(); });
  document.getElementById("btn-week").addEventListener("click", function (e) {
    openMenu(e.currentTarget, [
      { label: "This week", id: "w0" }, { label: "Next week", id: "w1" },
      { label: "This month", id: "m0" }, { label: "Everything", id: "all" }
    ], function () {});
  });
  document.getElementById("ws").addEventListener("click", function (e) {
    openMenu(e.currentTarget, [
      { label: "Bangkok operations", id: "bkk" },
      { label: "Retail counters", id: "retail" },
      { label: "Food service", id: "fs" }
    ], function () {});
  });

  var dlg = document.getElementById("dlg");
  function fillSelect(sel, items, val) {
    sel.innerHTML = items.map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === val ? " selected" : "") + ">" + esc(i.label) + "</option>";
    }).join("");
  }
  function openDialog(groupId) {
    fillSelect(document.getElementById("f-group"), GROUPS.map(function (g) { return { id: g.id, label: g.name }; }), groupId || "ops");
    fillSelect(document.getElementById("f-owner"), PEOPLE.map(function (p) { return { id: p.id, label: p.full + " — " + p.role }; }), state.me);
    fillSelect(document.getElementById("f-status"), STATUS.map(function (s) { return { id: s.id, label: s.label }; }), "todo");
    fillSelect(document.getElementById("f-prio"), PRIOS.map(function (p) { return { id: p.id, label: p.label }; }), "normal");
    dlg.showModal();
    document.getElementById("f-title").focus();
  }
  document.getElementById("btn-new").addEventListener("click", function () { openDialog("ops"); });
  document.getElementById("dlg-cancel").addEventListener("click", function () { dlg.close(); });
  document.getElementById("dlg-form").addEventListener("submit", function () {
    var title = document.getElementById("f-title").value.trim();
    if (!title) return;
    TASKS.unshift({
      id: "t" + Date.now(),
      g: document.getElementById("f-group").value,
      t: title,
      o: document.getElementById("f-owner").value,
      s: document.getElementById("f-status").value,
      p: document.getElementById("f-prio").value,
      d: document.getElementById("f-due").value || "2026-09-01",
      e: 2,
      r: document.getElementById("f-repeat").value || undefined,
      sub: [],
      files: []
    });
    document.getElementById("f-title").value = "";
    state.view = "board";
    state.collapsed = {};
    render();
  });

  // ---------- lookups, files, drag and drop ----------
  function closestEl(node, sel) {
    var n = node && node.nodeType === 3 ? node.parentNode : node;
    return n && n.closest ? n.closest(sel) : null;
  }
  function findTask(id) {
    for (var i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) return TASKS[i];
    return null;
  }
  function findSub(taskId, subId) {
    var t = findTask(taskId);
    if (!t) return null;
    for (var i = 0; i < t.sub.length; i++) if (t.sub[i].id === subId) return t.sub[i];
    return null;
  }
  function addFiles(host, list) {
    if (!host || !list || !list.length) return;
    if (!host.files) host.files = [];
    for (var i = 0; i < list.length; i++) {
      var f = list[i], rec = { name: f.name, size: f.size };
      if (f.type && f.type.indexOf("image/") === 0 && window.URL && URL.createObjectURL) {
        try { rec.url = URL.createObjectURL(f); } catch (err) { /* preview is optional */ }
      }
      host.files.push(rec);
    }
  }

  var picker = document.createElement("input");
  picker.type = "file";
  picker.multiple = true;
  picker.style.display = "none";
  document.body.appendChild(picker);
  var pickTarget = null;
  function pickFilesFor(taskId, subId) {
    pickTarget = { task: taskId, sub: subId };
    picker.click();
  }
  picker.addEventListener("change", function () {
    if (pickTarget && picker.files && picker.files.length) {
      addFiles(pickTarget.sub ? findSub(pickTarget.task, pickTarget.sub) : findTask(pickTarget.task), picker.files);
      state.expanded[pickTarget.task] = state.expanded[pickTarget.task] || !!pickTarget.sub;
      renderBoard();
    }
    picker.value = "";
    pickTarget = null;
  });

  // new subtask
  document.addEventListener("submit", function (e) {
    var form = closestEl(e.target, "[data-addsub]");
    if (!form) return;
    e.preventDefault();
    var t = findTask(form.dataset.addsub);
    var input = form.querySelector("input");
    var title = input.value.trim();
    if (!t || !title) return;
    t.sub.push({ id: "s" + Date.now(), t: title, o: t.o, done: false, files: [] });
    state.focus = { kind: "addsub", id: t.id };
    renderBoard();
  });

  // reorder: drag from the grip, or move with the arrow keys while it has focus
  var dragId = null;
  function clearMarks() {
    var marked = document.querySelectorAll(".dropbefore, .dropafter, .filedrop");
    for (var i = 0; i < marked.length; i++) marked[i].classList.remove("dropbefore", "dropafter", "filedrop");
  }
  function clearDraggable() {
    var d = document.querySelectorAll('.titem[draggable="true"]');
    for (var i = 0; i < d.length; i++) d[i].draggable = false;
  }
  function moveTask(id, targetId, after, groupId) {
    var from = -1, i;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) from = i;
    if (from < 0) return;
    var t = TASKS.splice(from, 1)[0];
    if (groupId) t.g = groupId;
    var to = -1;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === targetId) to = i;
    if (to < 0) TASKS.push(t);
    else TASKS.splice(after ? to + 1 : to, 0, t);
  }
  function moveToGroupEnd(id, groupId) {
    var from = -1, i, last = -1;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) from = i;
    if (from < 0) return;
    var t = TASKS.splice(from, 1)[0];
    t.g = groupId;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].g === groupId) last = i;
    TASKS.splice(last + 1, 0, t);
  }
  function nudge(id, dir) {
    var t = findTask(id);
    if (!t) return;
    var idx = [], i;
    for (i = 0; i < TASKS.length; i++) if (TASKS[i].g === t.g && visible(TASKS[i])) idx.push(i);
    var pos = idx.indexOf(TASKS.indexOf(t));
    var swap = idx[pos + dir];
    if (swap === undefined) return;
    var a = TASKS.indexOf(t);
    TASKS[a] = TASKS[swap];
    TASKS[swap] = t;
  }

  document.addEventListener("mousedown", function (e) {
    var g = closestEl(e.target, "[data-grip]");
    if (g) { var it = closestEl(g, ".titem"); if (it) it.draggable = true; }
  });
  document.addEventListener("mouseup", clearDraggable);

  document.addEventListener("dragstart", function (e) {
    var it = closestEl(e.target, ".titem");
    if (!it || !it.draggable) return;
    dragId = it.dataset.item;
    it.classList.add("dragging");
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* Safari */ }
    }
  });
  document.addEventListener("dragend", function () {
    dragId = null;
    clearMarks();
    clearDraggable();
    var d = document.querySelectorAll(".dragging");
    for (var i = 0; i < d.length; i++) d[i].classList.remove("dragging");
  });

  function hasFiles(dt) {
    if (!dt || !dt.types) return false;
    for (var i = 0; i < dt.types.length; i++) if (dt.types[i] === "Files") return true;
    return false;
  }

  document.addEventListener("dragover", function (e) {
    var item = closestEl(e.target, ".titem");
    var sub = closestEl(e.target, ".subrow");
    if (hasFiles(e.dataTransfer)) {
      e.preventDefault();
      clearMarks();
      var zone = sub || item;
      if (zone) { e.dataTransfer.dropEffect = "copy"; zone.classList.add("filedrop"); }
      return;
    }
    if (!dragId) return;
    clearMarks();
    if (item && item.dataset.item !== dragId) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var r = item.getBoundingClientRect();
      item.classList.add(e.clientY > r.top + r.height / 2 ? "dropafter" : "dropbefore");
    } else if (closestEl(e.target, ".group")) {
      e.preventDefault();
    }
  });

  document.addEventListener("drop", function (e) {
    var item = closestEl(e.target, ".titem");
    var sub = closestEl(e.target, ".subrow");
    var grp = closestEl(e.target, ".group");

    if (hasFiles(e.dataTransfer)) {
      e.preventDefault();
      clearMarks();
      if (sub) {
        var q = sub.dataset.sub.split("|");
        addFiles(findSub(q[0], q[1]), e.dataTransfer.files);
        renderBoard();
      } else if (item) {
        addFiles(findTask(item.dataset.item), e.dataTransfer.files);
        renderBoard();
      }
      return;
    }

    if (!dragId) return;
    e.preventDefault();
    if (item && item.dataset.item !== dragId) {
      var r = item.getBoundingClientRect();
      moveTask(dragId, item.dataset.item, e.clientY > r.top + r.height / 2, grp ? grp.dataset.group : null);
    } else if (grp) {
      moveToGroupEnd(dragId, grp.dataset.group);
    }
    dragId = null;
    clearMarks();
    clearDraggable();
    renderRail();
    render();
  });

  document.addEventListener("keydown", function (e) {
    var g = closestEl(e.target, "[data-grip]");
    if (!g || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
    e.preventDefault();
    nudge(g.dataset.grip, e.key === "ArrowUp" ? -1 : 1);
    state.focus = { kind: "grip", id: g.dataset.grip };
    renderBoard();
  });

  renderRail();
  render();
})();
</script>
