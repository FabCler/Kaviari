<title>Kaviari Team Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root {
    /* Chrome */
    --navy: #0f192b;
    --navy-soft: #16233c;
    --rail-ink: #d6d2c6;
    --rail-ink-dim: rgba(214, 210, 198, 0.62);
    --rail-line: rgba(232, 213, 163, 0.14);
    --pearl: #f7f5f0;

    /* Surfaces + ink */
    --bg: #f7f5f0;
    --surface: #fffefb;
    --surface-2: #f2efe6;
    --ink: #171a20;
    --ink-2: #4a4d55;
    --ink-muted: #6d6f74;
    --line: #e3dfd2;
    --line-soft: #ece8dc;

    /* Accent */
    --gold: #c9a227;
    --gold-deep: #a9861c;
    --gold-wash: #f3ead3;
    --champagne: #e8d5a3;

    /* Status */
    --st-todo: #7b7f88;
    --st-doing: #2a78d6;
    --st-wait: #b07e00;
    --st-block: #c2452f;
    --st-done: #2f7d5c;
    --st-ink: #ffffff;

    /* Streams */
    --stream-ops: #1b9e8f;
    --stream-festive: #b07e00;
    --stream-retail: #6d5bd0;
    --stream-supply: #2a78d6;
    --stream-intake: #c2452f;

    --danger: #b3261e;
    --warning: #b97e10;
    --success: #2f7d5c;

    --radius: 8px;
    --shadow: 0 1px 2px rgb(15 25 43 / 0.06), 0 8px 24px -14px rgb(15 25 43 / 0.28);
    --row-cols: minmax(300px, 1fr) 152px 150px 116px 128px 78px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #0a1120;
      --navy-soft: #131e33;
      --rail-ink: #c9c4b6;
      --rail-ink-dim: rgba(201, 196, 182, 0.6);
      --rail-line: rgba(232, 213, 163, 0.12);

      --bg: #0f192b;
      --surface: #16233c;
      --surface-2: #1b2a45;
      --ink: #ece7d9;
      --ink-2: #bfc5d1;
      --ink-muted: #98a1b1;
      --line: rgba(232, 213, 163, 0.15);
      --line-soft: rgba(232, 213, 163, 0.09);

      --gold: #d9b64a;
      --gold-deep: #c9a227;
      --gold-wash: rgba(201, 162, 39, 0.14);

      --st-todo: #8b93a2;
      --st-doing: #4b8fe4;
      --st-wait: #cf9c1c;
      --st-block: #dc6552;
      --st-done: #3f9d75;
      --st-ink: #0d1524;

      --stream-ops: #35bdad;
      --stream-festive: #cf9c1c;
      --stream-retail: #9182e6;
      --stream-supply: #4b8fe4;
      --stream-intake: #dc6552;

      --danger: #e0705f;
      --warning: #d7a12f;
      --success: #4fae84;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 28px -16px rgb(0 0 0 / 0.7);
    }
  }

  :root[data-theme="dark"] {
    --navy: #0a1120;
    --navy-soft: #131e33;
    --rail-ink: #c9c4b6;
    --rail-ink-dim: rgba(201, 196, 182, 0.6);
    --rail-line: rgba(232, 213, 163, 0.12);

    --bg: #0f192b;
    --surface: #16233c;
    --surface-2: #1b2a45;
    --ink: #ece7d9;
    --ink-2: #bfc5d1;
    --ink-muted: #98a1b1;
    --line: rgba(232, 213, 163, 0.15);
    --line-soft: rgba(232, 213, 163, 0.09);

    --gold: #d9b64a;
    --gold-deep: #c9a227;
    --gold-wash: rgba(201, 162, 39, 0.14);

    --st-todo: #8b93a2;
    --st-doing: #4b8fe4;
    --st-wait: #cf9c1c;
    --st-block: #dc6552;
    --st-done: #3f9d75;
    --st-ink: #0d1524;

    --stream-ops: #35bdad;
    --stream-festive: #cf9c1c;
    --stream-retail: #9182e6;
    --stream-supply: #4b8fe4;
    --stream-intake: #dc6552;

    --danger: #e0705f;
    --warning: #d7a12f;
    --success: #4fae84;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 28px -16px rgb(0 0 0 / 0.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, p, ul, ol { margin: 0; }
  ul { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }

  :where(a, button, input, select, [tabindex]):focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .tnum { font-variant-numeric: tabular-nums lining-nums; }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100dvh; }

  .rail {
    background: var(--navy);
    background-image: radial-gradient(circle at 1px 1px, rgb(232 213 163 / 0.13) 1px, transparent 0);
    background-size: 14px 14px;
    color: var(--rail-ink);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100dvh;
  }

  .wordmark { padding: 26px 24px 18px; }
  .wordmark b {
    display: block;
    font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.18em;
    line-height: 1;
    color: var(--pearl);
  }
  .wordmark span {
    display: block;
    margin-top: 6px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .gold-rule {
    height: 1px;
    margin-top: 16px;
    background: linear-gradient(90deg, transparent, var(--gold) 18%, var(--champagne) 50%, var(--gold) 82%, transparent);
    opacity: 0.7;
  }

  .rail nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; flex: 1; overflow-y: auto; }
  .rail nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--rail-ink);
    text-decoration: none;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .rail nav a:hover { background: rgb(255 255 255 / 0.06); color: var(--pearl); }
  .rail nav a[aria-current="page"] {
    background: rgb(201 162 39 / 0.14);
    color: var(--champagne);
    font-weight: 600;
  }
  .rail nav a .ico { width: 16px; height: 16px; flex: none; opacity: 0.85; }
  .rail nav a[aria-current="page"] .ico { color: var(--gold); opacity: 1; }
  .rail nav .sep { height: 1px; background: var(--rail-line); margin: 10px 12px; }
  .rail nav .new { color: var(--gold); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; margin-left: auto; }

  .rail-foot {
    border-top: 1px solid var(--rail-line);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rail-foot .who { min-width: 0; }
  .rail-foot .who b { display: block; font-size: 13px; font-weight: 500; color: var(--pearl); }
  .rail-foot .who span { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rail-ink-dim); }

  main { min-width: 0; padding: 30px 34px 56px; }

  /* ---------- Page head ---------- */
  .pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; justify-content: space-between; }
  .pagehead h1 {
    font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
    font-size: 38px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.05;
  }
  .pagehead .sub { margin-top: 4px; color: var(--ink-muted); font-size: 13px; }
  .headtools { display: flex; align-items: center; gap: 10px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--pearl);
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--navy-soft); }
  .btn-primary .plus { color: var(--gold); font-size: 15px; line-height: 1; }

  /* ---------- KPI strip ---------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 15px 14px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--kpi-color, var(--line)); }
  .kpi .v { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .kpi .k { margin-top: 2px; }
  .kpi .hint { margin-top: 5px; font-size: 11.5px; color: var(--ink-muted); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 26px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; gap: 2px; }
  .tab {
    border: 0;
    background: none;
    padding: 7px 13px 10px;
    cursor: pointer;
    color: var(--ink-muted);
    font-size: 13.5px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    margin-bottom: -13px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--gold); }
  .tab .n {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 99px;
    background: var(--surface-2);
    color: var(--ink-muted);
    font-weight: 600;
  }
  .tab[aria-selected="true"] .n { background: var(--gold-wash); color: var(--gold-deep); }

  .spacer { flex: 1; }

  .search {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
  }
  .search input { border: 0; background: none; outline: none; color: inherit; font-size: 13px; width: 168px; }
  .search input::placeholder { color: var(--ink-muted); }

  .facepile { display: flex; align-items: center; gap: 5px; }
  .facepile .avatar-btn {
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    border-radius: 99px;
    line-height: 0;
    opacity: 0.42;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .facepile .avatar-btn:hover { opacity: 0.8; }
  .facepile .avatar-btn.on { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--gold); }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
  }
  .toggle input { accent-color: var(--gold-deep); width: 15px; height: 15px; }

  /* ---------- Avatars ---------- */
  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 99px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    flex: none;
  }
  .avatar.lg { width: 34px; height: 34px; font-size: 12px; }
  .avatar.owner { box-shadow: inset 0 0 0 1.5px var(--gold); }

  /* ---------- Board ---------- */
  .scroller { overflow-x: auto; margin-top: 18px; padding-bottom: 4px; }
  .board { min-width: 900px; display: flex; flex-direction: column; gap: 20px; }

  .group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-left: 3px solid var(--gc);
    background: var(--surface);
  }
  .group-head .caret {
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--gc);
    padding: 2px;
    line-height: 0;
    transition: transform 0.18s ease;
  }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group-head h3 { font-size: 14.5px; font-weight: 600; color: var(--gc); letter-spacing: 0.01em; }
  .group-head .count { font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--ink-muted); }
  .group-head .mini .dotstat { display: inline-flex; align-items: center; gap: 5px; }
  .group-head .mini i { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }

  .cols, .row { display: grid; grid-template-columns: var(--row-cols); align-items: center; column-gap: 12px; }
  .cols { padding: 7px 14px 7px 17px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }
  .group.collapsed .cols, .group.collapsed .rows { display: none; }

  .row {
    padding: 9px 14px 9px 17px;
    border-top: 1px solid var(--line-soft);
    transition: background-color 0.12s ease;
  }
  .row:hover { background: var(--surface-2); }
  .row.is-done .task-title { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--line); }

  .task { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .check {
    width: 17px; height: 17px; margin-top: 2px; flex: none;
    border-radius: 4px; border: 1.5px solid var(--line); background: var(--surface);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .check:hover { border-color: var(--st-done); }
  .check.on { background: var(--st-done); border-color: var(--st-done); color: #fff; }
  .task-title { font-size: 13.5px; line-height: 1.35; }
  .task-meta { margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-muted); }
  .chip-repeat {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--line); border-radius: 99px; padding: 0 7px 0 5px; height: 17px;
    color: var(--ink-2);
  }
  .task-note { color: var(--st-block); }

  .owner-cell { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 3px 5px; border-radius: 6px; cursor: pointer; min-width: 0; text-align: left; }
  .owner-cell:hover { background: var(--line-soft); }
  .owner-cell .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status {
    border: 0; cursor: pointer; width: 100%; height: 29px; border-radius: 5px;
    color: var(--st-ink); background: var(--sc);
    font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: filter 0.15s ease;
  }
  .status:hover { filter: brightness(1.07); }

  .prio { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .prio i { width: 3px; height: 13px; border-radius: 2px; background: var(--pc); display: inline-block; }
  .prio.p-critical { color: var(--danger); font-weight: 600; }
  .prio.p-high { font-weight: 600; }
  .prio.p-low { color: var(--ink-muted); }

  .due { font-size: 12.5px; }
  .due small { display: block; font-size: 10.5px; color: var(--ink-muted); }
  .due.overdue { color: var(--danger); font-weight: 600; }
  .due.overdue small { color: var(--danger); opacity: 0.85; }
  .due.today { color: var(--gold-deep); font-weight: 600; }

  .est { font-size: 12.5px; color: var(--ink-muted); text-align: right; }

  .addrow {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px 11px 34px;
    border-top: 1px solid var(--line-soft);
    color: var(--ink-muted); font-size: 12.5px;
    border-width: 0 0 0 0; background: none; cursor: pointer; width: 100%;
  }
  .addrow:hover { color: var(--ink); background: var(--surface-2); }
  .group.collapsed .addrow { display: none; }

  .empty { padding: 40px 16px; text-align: center; color: var(--ink-muted); font-size: 13px; }

  /* ---------- My week ---------- */
  .week { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
  .daycard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .daycard > header { display: flex; align-items: baseline; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line-soft); }
  .daycard > header h3 { font-size: 13.5px; font-weight: 600; }
  .daycard > header .when { font-size: 11.5px; color: var(--ink-muted); }
  .daycard > header .tot { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }
  .daycard.alert > header h3 { color: var(--danger); }
  .daycard.decide > header h3 { color: var(--warning); }
  .wrow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line-soft); }
  .wrow:first-of-type { border-top: 0; }
  .wrow .grow { min-width: 0; flex: 1; }
  .wrow .stream { font-size: 11px; color: var(--sc2); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .wrow .t { font-size: 13.5px; }
  .wrow .status { width: 132px; flex: none; }

  /* ---------- Projects ---------- */
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(208px, 1fr); gap: 14px; min-width: 900px; }
  .lane { display: flex; flex-direction: column; gap: 10px; }
  .lane > header { display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; border-bottom: 2px solid var(--lc); }
  .lane > header h3 { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .lane > header .n { font-size: 11.5px; color: var(--ink-muted); margin-left: auto; }
  .pcard {
    border: 1px solid var(--line); border-left: 3px solid var(--hc);
    border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    padding: 12px 13px; display: flex; flex-direction: column; gap: 9px;
  }
  .pcard h4 { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .pcard .health { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--hc); }
  .pcard .health i { width: 7px; height: 7px; border-radius: 99px; background: var(--hc); }
  .pcard .ms { font-size: 12px; color: var(--ink-2); }
  .pcard .ms b { font-weight: 600; }
  .pcard footer { display: flex; align-items: center; gap: 8px; padding-top: 3px; border-top: 1px solid var(--line-soft); }
  .pcard footer .tasks { margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }
  .bar { height: 5px; border-radius: 99px; background: var(--line-soft); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--hc); border-radius: 99px; }

  /* ---------- Team load ---------- */
  .loadwrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); margin-top: 20px; overflow: hidden; }
  .loadwrap > header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; margin-left: auto; font-size: 11.5px; color: var(--ink-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; }
  .lrow { display: grid; grid-template-columns: 210px minmax(220px, 1fr) 96px 128px; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
  .lrow:first-of-type { border-top: 0; }
  .who2 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who2 > div > b { font-size: 13.5px; font-weight: 600; display: block; }
  .who2 > div > span { font-size: 11px; color: var(--ink-muted); display: block; }
  .stack { display: flex; height: 22px; border-radius: 4px; overflow: hidden; background: var(--line-soft); position: relative; }
  .stack > i { display: block; height: 100%; }
  .stack .cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.45; }
  .hours { font-size: 13px; text-align: right; }
  .hours small { color: var(--ink-muted); }
  .flag { font-size: 11.5px; font-weight: 600; text-align: right; }
  .flag.over { color: var(--danger); }
  .flag.ok { color: var(--success); }
  .flag.light { color: var(--ink-muted); font-weight: 500; }

    if (top + m.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - m.offsetHeight - 6);

    m.style.top = top + "px";

        (n[2] ? '<span class="new">New</span>' : "") + "</a>";
    }).join("");
    nav.addEventListener("click", function (e) {
      var a = e.target.closest("a");
      if (a) e.preventDefault();
    });
  }

  function renderKpis() {
    var open = TASKS.filter(function (t) { return t.s !== "done"; });
    var dueToday = open.filter(function (t) { return days(TODAY, t.d) === 0; });
    var overdue = open.filter(isOverdue);
    var blocked = TASKS.filter(function (t) { return t.s === "block" || t.s === "wait"; });
    var doneWeek = TASKS.filter(function (t) { return t.s === "done"; });

    var cards = [
      { v: open.length, k: "Open tasks", hint: "across 5 streams", c: "var(--st-doing)" },
      { v: dueToday.length, k: "Due today", hint: "Friday 28 August", c: "var(--gold)" },
      { v: overdue.length, k: "Overdue", hint: overdue.length ? overdue.map(function (t) { return person(t.o).name; }).join(", ") : "nothing late", c: "var(--danger)" },
      { v: blocked.length, k: "Blocked / waiting", hint: "needs a decision", c: "var(--st-wait)" },
      { v: doneWeek.length, k: "Done this week", hint: "since Monday", c: "var(--success)" }
    ];
    document.getElementById("kpis").innerHTML = cards.map(function (c) {
      return '<article class="kpi" style="--kpi-color:' + c.c + '">' +
        '<div class="v tnum">' + c.v + "</div>" +
        '<div class="k label">' + c.k + "</div>" +
        '<div class="hint">' + esc(c.hint) + "</div></article>";
    }).join("");
  }

  var VIEWS = [
    { id: "board", label: "Board" },
    { id: "week", label: "My week" },
    { id: "projects", label: "Projects" },
    { id: "load", label: "Team load" }
  ];

  function renderTabs() {
    var counts = {
      board: TASKS.filter(function (t) { return t.s !== "done"; }).length,
      week: TASKS.filter(function (t) { return t.o === state.me && t.s !== "done"; }).length,
      projects: PROJECTS.length,
      load: PEOPLE.length
    };
    var wrap = document.getElementById("tabs");
    wrap.innerHTML = VIEWS.map(function (v) {
      return '<button class="tab" role="tab" data-view="' + v.id + '" aria-selected="' +
        (state.view === v.id) + '">' + v.label + '<span class="n tnum">' + counts[v.id] + "</span></button>";
    }).join("");
  }

  function renderFacepile() {
    document.getElementById("facepile").innerHTML = PEOPLE.map(function (p) {
      return '<button class="avatar-btn' + (state.people[p.id] ? " on" : "") + '" data-person="' + p.id +
        '" aria-pressed="' + !!state.people[p.id] + '" aria-label="Filter by ' + esc(p.full) + '">' +
        avatar(p) + "</button>";
    }).join("");
  }

  // ---------- board ----------
  function statusCell(t) {
    var s = status(t.s);
    return '<button class="status" style="--sc:' + s.color + '" data-status="' + t.id +
      '" aria-label="Status: ' + s.label + '. Change status">' + s.label + "</button>";
  }

  function taskRow(t) {
    var p = person(t.o), pr = prio(t.p), dm = dueMeta(t);
    return '<div class="row' + (t.s === "done" ? " is-done" : "") + '" data-row="' + t.id + '">' +
      '<div class="task">' +
        '<button class="check' + (t.s === "done" ? " on" : "") + '" data-check="' + t.id +
          '" aria-label="Mark done" aria-pressed="' + (t.s === "done") + '">' +
          (t.s === "done" ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>' : "") +
        "</button>" +
        "<div>" +
          '<div class="task-title">' + esc(t.t) + "</div>" +
          '<div class="task-meta">' +
            (t.r ? '<span class="chip-repeat"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>' + (t.r === "daily" ? "Daily" : "Weekly") + "</span>" : "") +
            (t.n ? '<span class="task-note">' + esc(t.n) + "</span>" : "") +
          "</div>" +
        "</div>" +
      "</div>" +
      '<button class="owner-cell" data-owner="' + t.id + '" aria-label="Owner: ' + esc(p.full) + '. Reassign">' +
        avatar(p) + '<span class="nm">' + esc(p.name) + "</span></button>" +
      statusCell(t) +
      '<span class="prio p-' + t.p + '" style="--pc:' + pr.color + '"><i></i>' + pr.label + "</span>" +
      '<span class="due tnum ' + dm.cls + '">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
      '<span class="est tnum">' + t.e + " h</span>" +
    "</div>";
  }

  function renderBoard() {
    var host = document.getElementById("view");
    var any = false;
    var html = '<div class="scroller"><div class="board">';

    GROUPS.forEach(function (g) {
      var rows = TASKS.filter(function (t) { return t.g === g.id && visible(t); });
      var all = TASKS.filter(function (t) { return t.g === g.id; });
      if (!rows.length && (state.q || activePeople().length)) return;
      any = any || rows.length > 0;
      var doneN = all.filter(function (t) { return t.s === "done"; }).length;
      var blockN = all.filter(function (t) { return t.s === "block"; }).length;
      var lateN = all.filter(isOverdue).length;

      html += '<section class="group' + (state.collapsed[g.id] ? " collapsed" : "") + '" style="--gc:' + g.color + '" data-group="' + g.id + '">' +
        '<header class="group-head">' +
          '<button class="caret" data-collapse="' + g.id + '" aria-expanded="' + !state.collapsed[g.id] + '" aria-label="Collapse ' + esc(g.name) + '">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
          "</button>" +
          "<h3>" + esc(g.name) + "</h3>" +
          '<span class="count tnum">' + rows.length + " task" + (rows.length === 1 ? "" : "s") + "</span>" +
          '<div class="mini">' +
            (lateN ? '<span class="dotstat"><i style="background:var(--st-block)"></i>' + lateN + " late</span>" : "") +
            (blockN ? '<span class="dotstat"><i style="background:var(--st-block)"></i>' + blockN + " blocked</span>" : "") +
            '<span class="dotstat"><i style="background:var(--st-done)"></i>' + doneN + " / " + all.length + " done</span>" +
          "</div>" +
        "</header>" +
        '<div class="cols">' +
          '<span class="label">Task</span><span class="label">Owner</span><span class="label">Status</span>' +
          '<span class="label">Priority</span><span class="label">Due</span><span class="label" style="text-align:right">Est.</span>' +
        "</div>" +
        '<div class="rows">' + rows.map(taskRow).join("") + "</div>" +
        '<button class="addrow" data-add="' + g.id + '">+ Add a task to ' + esc(g.name.toLowerCase()) + "</button>" +
      "</section>";
    });

    html += "</div></div>";
    if (!any) html = '<div class="empty">No task matches this filter. Clear the search or the people filter.</div>';
    host.innerHTML = html;
  }

  // ---------- my week ----------
  function renderWeek() {
    var me = person(state.me);
    var mine = TASKS.filter(function (t) { return t.o === state.me && visible(t); });
    var buckets = [
      { key: "late", title: "Overdue", when: "needs attention now", alert: true, f: function (t) { return isOverdue(t); } },
      { key: "today", title: "Today", when: "Friday 28 August", f: function (t) { return days(TODAY, t.d) === 0 && t.s !== "done"; } },
      { key: "soon", title: "Next week", when: "31 Aug – 4 Sep", f: function (t) { var d = days(TODAY, t.d); return d > 0 && d <= 7 && t.s !== "done"; } },
      { key: "later", title: "Later", when: "beyond 4 September", f: function (t) { return days(TODAY, t.d) > 7 && t.s !== "done"; } },
      { key: "done", title: "Closed this week", when: "", f: function (t) { return t.s === "done"; } }
    ];

    var html = '<div class="pagehead" style="margin-top:20px;align-items:center">' +
      '<div style="display:flex;align-items:center;gap:12px">' + avatar(me, "lg") +
      '<div><div style="font-weight:600;font-size:15px">' + esc(me.full) + "</div>" +
      '<div class="sub" style="margin:0">' + esc(me.role) + "</div></div></div>" +
      '<button class="btn" id="switch-person">Show another person’s week ▾</button></div>';

    html += '<div class="week">';
    var shown = 0;

    if (me.owner) {
      var stuck = TASKS.filter(function (t) { return (t.s === "block" || t.s === "wait") && t.o !== state.me; });
      if (stuck.length) {
        html += '<section class="daycard decide"><header><h3>Needs a decision from you</h3>' +
          '<span class="when">blocked or waiting elsewhere on the team</span>' +
          '<span class="tot tnum">' + stuck.length + " item" + (stuck.length === 1 ? "" : "s") + "</span></header>";
        stuck.forEach(function (t) {
          var g = group(t.g), dm = dueMeta(t), o = person(t.o);
          html += '<div class="wrow">' + avatar(o) +
            '<div class="grow"><div class="stream" style="--sc2:' + g.color + '">' + esc(g.name) + "</div>" +
            '<div class="t">' + esc(t.t) + "</div>" +
            (t.n ? '<div class="task-meta"><span class="task-note">' + esc(t.n) + "</span></div>" : "") +
            "</div>" +
            '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
            statusCell(t) + "</div>";
        });
        html += "</section>";
      }
    }
    buckets.forEach(function (b) {
      var rows = mine.filter(b.f);
      if (!rows.length) return;
      shown += rows.length;
      var hours = rows.reduce(function (a, t) { return a + t.e; }, 0);
      html += '<section class="daycard' + (b.alert ? " alert" : "") + '">' +
        "<header><h3>" + b.title + "</h3>" +
        (b.when ? '<span class="when">' + b.when + "</span>" : "") +
        '<span class="tot tnum">' + rows.length + " task" + (rows.length === 1 ? "" : "s") + " · " + hours + " h</span></header>";
      rows.forEach(function (t) {
        var g = group(t.g), dm = dueMeta(t);
        html += '<div class="wrow">' +
          '<button class="check' + (t.s === "done" ? " on" : "") + '" data-check="' + t.id + '" aria-label="Mark done"></button>' +
          '<div class="grow"><div class="stream" style="--sc2:' + g.color + '">' + esc(g.name) + "</div>" +
          '<div class="t">' + esc(t.t) + "</div></div>" +
          '<span class="due tnum ' + dm.cls + '" style="width:110px;flex:none">' + fmtDate(t.d) + "<small>" + dm.hint + "</small></span>" +
          statusCell(t) + "</div>";
      });
      html += "</section>";
    });
    html += "</div>";
    if (!shown) html += '<div class="empty">Nothing on ' + esc(me.name) + "’s plate with these filters.</div>";
    document.getElementById("view").innerHTML = html;

    var btn = document.getElementById("switch-person");
    btn.addEventListener("click", function () {
      openMenu(btn, PEOPLE.map(function (p) {
        return { label: p.full + " — " + p.role, id: p.id, avatar: avatar(p) };
      }), function (it) { state.me = it.id; renderTabs(); renderWeek(); });
    });
  }

  // ---------- projects ----------
  function renderProjects() {
    var html = '<div class="scroller"><div class="kanban">';
    STAGES.forEach(function (st) {
      var cards = PROJECTS.filter(function (p) { return p.stage === st.id; });
      html += '<section class="lane" style="--lc:' + st.color + '"><header><h3 style="color:' + st.color + '">' +
        st.id + '</h3><span class="n tnum">' + cards.length + "</span></header>";
      cards.forEach(function (p) {
        var h = HEALTH[p.health], o = person(p.o), late = days(TODAY, p.msd) < 0;
        html += '<article class="pcard" style="--hc:' + h.color + '">' +
          '<span class="health"><i></i>' + h.label + "</span>" +
          "<h4>" + esc(p.name) + "</h4>" +
          '<div class="ms">Next: <b>' + esc(p.ms) + "</b><br><span class=\"tnum\" style=\"color:" +
            (late ? "var(--danger)" : "var(--ink-muted)") + '">' + fmtDate(p.msd) + (late ? " · late" : "") + "</span></div>" +
          '<div class="bar"><span style="width:' + Math.round((p.done / p.total) * 100) + '%"></span></div>' +
          "<footer>" + avatar(o) + '<span style="font-size:12px">' + esc(o.name) + "</span>" +
          '<span class="tasks tnum">' + p.done + "/" + p.total + " tasks</span></footer></article>";
      });
      if (!cards.length) html += '<div class="empty" style="padding:22px 8px;font-size:12px">Empty</div>';
      html += "</section>";
    });
    html += "</div></div>";
    document.getElementById("view").innerHTML = html;
  }

  // ---------- team load ----------
  function renderLoad() {
    var CAP = 20; // hours of task work per week
    var rows = PEOPLE.map(function (p) {
      var mine = TASKS.filter(function (t) { return t.o === p.id && t.s !== "done"; });
      var byStatus = {};
      STATUS.forEach(function (s) {
        byStatus[s.id] = mine.filter(function (t) { return t.s === s.id; }).reduce(function (a, t) { return a + t.e; }, 0);
      });
      return {
        p: p,
        hours: mine.reduce(function (a, t) { return a + t.e; }, 0),
        late: mine.filter(isOverdue).length,
        n: mine.length,
        byStatus: byStatus,
        done: TASKS.filter(function (t) { return t.o === p.id && t.s === "done"; }).length
      };
    }).sort(function (a, b) { return b.hours - a.hours; });

    var max = Math.max(CAP * 1.35, rows[0].hours * 1.1);

    var html = '<div class="loadwrap"><header>' +
      '<h3 style="font-size:14px;font-weight:600">Open workload this week</h3>' +
      '<span style="font-size:12px;color:var(--ink-muted)">Capacity line at ' + CAP + ' h · estimates from the task cards</span>' +
      '<div class="legend">' + STATUS.filter(function (s) { return s.id !== "done"; }).map(function (s) {
        return '<span><i style="background:' + s.color + '"></i>' + s.label + "</span>";
      }).join("") + "</div></header>";

    rows.forEach(function (r) {
      var flag = r.hours > CAP ? { cls: "over", txt: "Over capacity" }
        : r.late ? { cls: "over", txt: r.late + " overdue" }
        : r.hours < CAP * 0.5 ? { cls: "light", txt: "Room to take more" }
        : { cls: "ok", txt: "Balanced" };
      html += '<div class="lrow"><div class="who2">' + avatar(r.p, "lg") +
        "<div><b>" + esc(r.p.full) + "</b><span>" + esc(r.p.role) + "</span></div></div>" +
        '<div class="stack">' +
          STATUS.filter(function (s) { return s.id !== "done"; }).map(function (s) {
            var w = (r.byStatus[s.id] / max) * 100;
            return w > 0 ? '<i style="width:' + w + '%;background:' + s.color + '" title="' + s.label + ": " + r.byStatus[s.id] + ' h"></i>' : "";
          }).join("") +
          '<span class="cap" style="left:' + ((CAP / max) * 100) + '%"></span>' +
        "</div>" +
        '<div class="hours tnum">' + r.hours + ' h <small>/ ' + r.n + " open</small></div>" +
        '<div class="flag ' + flag.cls + '">' + flag.txt + "</div></div>";
    });
    html += "</div>";
    document.getElementById("view").innerHTML = html;
  }

  function render() {
    renderKpis();
    renderTabs();
    renderFacepile();
    if (state.view === "board") renderBoard();
    else if (state.view === "week") renderWeek();
    else if (state.view === "projects") renderProjects();
    else renderLoad();
    document.querySelector(".search").style.display = (state.view === "projects" || state.view === "load") ? "none" : "";
    document.getElementById("foot").textContent =
      "Prototype for the Kaviari Cellar team module — sample content. People, streams, tasks and estimates are placeholders to be replaced with the real team. Status, owner, tick-boxes, filters and “New task” are live in this mock-up; changes are not saved.";
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var tab = e.target.closest(".tab");
    if (tab) { state.view = tab.dataset.view; render(); return; }

    var face = e.target.closest("[data-person]");
    if (face) { var id = face.dataset.person; state.people[id] = !state.people[id]; render(); return; }

    var col = e.target.closest("[data-collapse]");
    if (col) { var g = col.dataset.collapse; state.collapsed[g] = !state.collapsed[g]; renderBoard(); return; }

    var chk = e.target.closest("[data-check]");
    if (chk) {
      var t = TASKS.filter(function (x) { return x.id === chk.dataset.check; })[0];
      t.s = t.s === "done" ? "doing" : "done";
      render();
      return;
    }

    var stBtn = e.target.closest("[data-status]");
    if (stBtn) {
      var task = TASKS.filter(function (x) { return x.id === stBtn.dataset.status; })[0];
      openMenu(stBtn, STATUS.map(function (s) { return { label: s.label, id: s.id, color: s.color }; }), function (it) {
        task.s = it.id; render();
      });
      return;
    }

    var ownBtn = e.target.closest("[data-owner]");
    if (ownBtn) {
      var tk = TASKS.filter(function (x) { return x.id === ownBtn.dataset.owner; })[0];
      openMenu(ownBtn, PEOPLE.map(function (p) { return { label: p.full, id: p.id, avatar: avatar(p) }; }), function (it) {
        tk.o = it.id; render();
      });
      return;
    }

    var add = e.target.closest("[data-add]");
    if (add) { openDialog(add.dataset.add); return; }
  });

  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value;
    if (state.view === "board") renderBoard(); else if (state.view === "week") renderWeek();
  });
  document.getElementById("showdone").addEventListener("change", function (e) {
    state.showDone = e.target.checked;
    render();
  });
  document.getElementById("btn-week").addEventListener("click", function (e) {
    openMenu(e.currentTarget, [
      { label: "This week", id: "w0" }, { label: "Next week", id: "w1" },
      { label: "This month", id: "m0" }, { label: "Everything", id: "all" }
    ], function () { /* prototype: single period */ });
  });

  // ---------- dialog ----------
  var dlg = document.getElementById("dlg");
  function fillSelect(sel, items, val) {
    sel.innerHTML = items.map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === val ? " selected" : "") + ">" + esc(i.label) + "</option>";
    }).join("");
  }
  function openDialog(groupId) {
    fillSelect(document.getElementById("f-group"), GROUPS.map(function (g) { return { id: g.id, label: g.name }; }), groupId || "ops");
    fillSelect(document.getElementById("f-owner"), PEOPLE.map(function (p) { return { id: p.id, label: p.full + " — " + p.role }; }), state.me);
    fillSelect(document.getElementById("f-status"), STATUS.map(function (s) { return { id: s.id, label: s.label }; }), "todo");
    fillSelect(document.getElementById("f-prio"), PRIOS.map(function (p) { return { id: p.id, label: p.label }; }), "normal");
    dlg.showModal();
    document.getElementById("f-title").focus();
  }
  document.getElementById("btn-new").addEventListener("click", function () { openDialog("ops"); });
  document.getElementById("dlg-cancel").addEventListener("click", function () { dlg.close(); });
  document.getElementById("dlg-form").addEventListener("submit", function () {
    var title = document.getElementById("f-title").value.trim();
    if (!title) return;
    TASKS.unshift({
      id: "t" + Date.now(),
      g: document.getElementById("f-group").value,
      t: title,
      o: document.getElementById("f-owner").value,
      s: document.getElementById("f-status").value,
      p: document.getElementById("f-prio").value,
      d: document.getElementById("f-due").value || "2026-09-01",
      e: 2,
      r: document.getElementById("f-repeat").value || undefined
    });
    document.getElementById("f-title").value = "";
    state.view = "board";
    render();
  });

  renderRail();
  render();
})();
</script>
